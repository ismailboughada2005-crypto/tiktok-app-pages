/* ───────────────────────── BASE ───────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:var(--body-size);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:var(--bg-art);z-index:-1}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;opacity:.85}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.spark{position:absolute;width:14px;height:14px;will-change:transform,opacity;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.spark.dot{clip-path:none;border-radius:50%;width:7px;height:7px}
.spark.conf{clip-path:none;border-radius:2px;width:8px;height:13px}

/* string lights */
.lights{position:absolute;top:0;left:0;width:100%;height:64px;pointer-events:none;z-index:3;overflow:hidden}
.lights svg{width:100%;height:64px}
.lights .wire{fill:none;stroke:var(--wire);stroke-width:1.6;opacity:.85}
.bulb{animation:twinkle 2.6s ease-in-out infinite}
.bulb:nth-child(4n+1){animation-delay:-.4s;animation-duration:3.1s}
.bulb:nth-child(4n+2){animation-delay:-1.3s}
.bulb:nth-child(4n+3){animation-delay:-2s;animation-duration:3.6s}
.bulb:nth-child(5n){animation-delay:-.9s;animation-duration:2.2s}
.bulb .glow{opacity:.28}
.bulb .cap{fill:#2a2a2a}
.c1{fill:var(--b1)}.c2{fill:var(--b2)}.c3{fill:var(--b3)}.c4{fill:var(--b4)}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}

/* ───────────────────────── ENVELOPE SCREEN ───────────────────────── */
#envelope-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(18px,4vh,36px);padding:80px 16px 40px;background:var(--bg-art),var(--bg);transition:opacity .7s ease,visibility 0s .7s}
#envelope-screen.done{opacity:0;visibility:hidden;pointer-events:none}
#envelope-screen[hidden]{display:none}
.env-from{font-family:var(--f-head);letter-spacing:var(--label-space);text-transform:uppercase;font-size:.78rem;color:var(--hint);
  text-align:center;margin:0;opacity:.9}
.env-from b{display:block;font-weight:400;font-family:var(--f-script);font-size:2.1rem;letter-spacing:0;text-transform:none;margin-top:.1em;line-height:1.15}
html[data-kind="fun"] .env-from b{font-family:var(--f-title);font-size:1.8rem}
.env-btn{all:unset;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:10px;margin-top:clamp(40px,11vh,110px)}
.env-btn:focus-visible{outline:3px solid var(--focus);outline-offset:10px}
.env{position:relative;width:min(88vw,430px);aspect-ratio:1.42;perspective:1400px;container-type:inline-size;
  animation:float 5s ease-in-out infinite;transition:transform .8s cubic-bezier(.5,0,.3,1)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-8px) rotate(.6deg)}}
.env-shadow{position:absolute;left:6%;right:6%;bottom:-9%;height:10%;background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);z-index:0}
.env-back{position:absolute;inset:0;background:var(--env2);border-radius:7px;z-index:1}
.env-inside{position:absolute;inset:0;z-index:1;border-radius:7px;background:var(--liner-art);clip-path:polygon(0 0,100% 0,100% 60%,0 60%);opacity:.96}
.env-letter{position:absolute;left:6%;right:6%;top:7%;height:86%;z-index:2;background:var(--paper-art),var(--paper);border-radius:4px;
  box-shadow:0 2px 10px rgba(0,0,0,.25);transition:transform .85s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;align-items:center;
  padding-top:9%;text-align:center;color:var(--ink);overflow:hidden}
.env-letter::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:2px}
.env-letter small{font-family:var(--f-head);letter-spacing:var(--label-space);text-transform:uppercase;font-size:11px;font-size:2.9cqw;color:var(--label)}
.env-letter span{font-family:var(--f-title);color:var(--title);font-size:30px;font-size:9.2cqw;line-height:1.05;margin-top:.15em;padding:0 8%}
html[data-kind="fun"] .env-letter span{font-size:7.4cqw}
.env-front{position:absolute;inset:0;z-index:3;border-radius:7px;
  background:linear-gradient(115deg,transparent 49.6%,rgba(0,0,0,.10) 50%,transparent 53%) 0 0/50% 100% no-repeat,
             linear-gradient(-115deg,transparent 49.6%,rgba(0,0,0,.10) 50%,transparent 53%) 100% 0/50% 100% no-repeat,
             linear-gradient(var(--env),var(--env2));
  clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}


.env-flap{position:absolute;inset:0;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.45,.05,.25,1),z-index 0s .38s}
.env-flap>i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 60%);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7px}
.flap-out{background:linear-gradient(var(--env-flap),var(--env))}
.flap-out::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.14))}
.flap-in{background:var(--liner-art);transform:rotateX(180deg)}
.env-address{position:absolute;left:0;right:0;top:67%;z-index:4;text-align:center;color:var(--name);padding:0 9%;transition:opacity .4s}
.env-address small{display:block;font-family:var(--f-head);letter-spacing:var(--label-space);text-transform:uppercase;font-size:10px;font-size:2.8cqw;color:var(--env-label)}
.env-address span{display:block;font-family:var(--f-script);font-size:28px;font-size:8.6cqw;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.1em 0}
.env-address span.long{font-size:6.4cqw}

/* wax seal */
.seal{position:absolute;left:50%;top:57%;width:21%;aspect-ratio:1;z-index:6;transform:translate(-50%,-50%)}
.seal-half{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,.6,.3,1),opacity .5s .12s}
.seal-half.l{clip-path:polygon(-20% -20%,52% -20%,44% 22%,56% 40%,45% 60%,55% 80%,49% 120%,-20% 120%)}
.seal-half.r{clip-path:polygon(52% -20%,120% -20%,120% 120%,49% 120%,55% 80%,45% 60%,56% 40%,44% 22%)}
.wax{position:absolute;inset:0;border-radius:47% 53% 50% 50%/52% 47% 53% 48%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.45),transparent 30%),radial-gradient(circle at 50% 50%,var(--seal1) 0 58%,var(--seal2) 100%);
  box-shadow:0 3px 7px rgba(0,0,0,.4),inset 0 -3px 6px rgba(0,0,0,.25)}
.wax::before{content:"";position:absolute;inset:13%;border-radius:50%;box-shadow:inset 0 2px 3px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.25);background:radial-gradient(circle,var(--seal1),var(--seal2) 130%)}
.wax svg{position:absolute;inset:24%;width:52%;height:52%;color:var(--seal-ink);filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}

.env.open .seal::before{opacity:0!important}
.env.open .seal-half.l{transform:translate(-42%,26%) rotate(-24deg);opacity:0}
.env.open .seal-half.r{transform:translate(42%,26%) rotate(24deg);opacity:0}
.env.open{animation:none}
.env.open .env-flap{transform:rotateX(180deg);z-index:1;transition-delay:.3s,.68s}
.env.open .env-letter{transform:translateY(-58%);transition-delay:.95s}
.env.open .env-address{opacity:.0}
.env.away{transform:translateY(26vh) scale(.9)}
.tap-hint{font-family:var(--f-head);letter-spacing:var(--label-space);text-transform:uppercase;font-size:.85rem;color:var(--hint);margin:0;
  animation:pulse 2s ease-in-out infinite;transition:opacity .3s}
@keyframes pulse{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
#envelope-screen.opening .tap-hint,#envelope-screen.opening .env-from{opacity:0;animation:none}

/* ───────────────────────── CARD ───────────────────────── */
#page{position:relative;padding:78px 12px 56px;opacity:0;transform:translateY(34px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
#page.in{opacity:1;transform:none}
#page[hidden]{display:none}
.card{position:relative;z-index:2;max-width:600px;margin:0 auto;background:var(--paper-art),var(--paper);border-radius:var(--radius);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.08) inset;padding:30px 24px 34px;text-align:center}
.card::before{content:"";position:absolute;inset:9px;border:1px solid var(--line);border-radius:calc(var(--radius) - 3px);pointer-events:none}
.card::after{content:"";position:absolute;inset:13px;border:1px solid var(--line);opacity:.5;border-radius:calc(var(--radius) - 5px);pointer-events:none}

html[data-kind="fun"] .card::before{border:2px dashed var(--line)}
html[data-kind="fun"] .card::after{display:none}


html[data-kind="lux"] .card{border:1px solid var(--line)}
.corner{position:absolute;width:74px;height:74px;color:var(--gold);pointer-events:none;z-index:1}
.corner.tl{top:4px;left:4px}.corner.tr{top:4px;right:4px;transform:scaleX(-1)}
.corner.bl{bottom:4px;left:4px;transform:scaleY(-1)}.corner.br{bottom:4px;right:4px;transform:scale(-1)}
section{position:relative;padding:8px 0}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
html.in-editor .rv{opacity:1;transform:none;transition:none}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:22px auto;color:var(--gold);max-width:340px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.divider::after{transform:scaleX(-1)}
html[data-kind="fun"] .divider::before,html[data-kind="fun"] .divider::after{height:0;background:none;border-top:2px dashed var(--line)}
.divider svg{width:64px;height:28px;flex:none}
.label{font-family:var(--f-head);text-transform:uppercase;letter-spacing:var(--label-space);font-size:.8rem;font-weight:600;color:var(--label);margin:0}
html[data-kind="lux"] .label{font-size:.7rem;font-weight:400}
html[data-kind="fun"] .label{font-family:var(--f-body);font-size:.95rem;font-weight:400}
h2.sec{font-family:var(--f-script);font-weight:400;font-size:2.5rem;line-height:1.1;margin:.1em 0 .5em;color:var(--title)}
html[data-kind="fun"] h2.sec{font-family:var(--f-head);font-weight:700;font-size:2rem}
p{margin:.4em 0}

/* hero */
.ornament{all:unset;cursor:pointer;display:block;width:110px;margin:-4px auto 2px;position:relative;transform-origin:50% 100%;animation:swing 4.5s ease-in-out infinite;-webkit-tap-highlight-color:transparent}

.ornament:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:12px}
.ornament svg{width:110px;height:96px;overflow:visible}
.ornament.pop svg{animation:pop .5s ease}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes pop{40%{transform:scale(1.22)}}
.dear{font-family:var(--f-script);font-size:2rem;color:var(--ink);margin:0 0 .2em;line-height:1.15}

.intro{max-width:24em;margin:0 auto}
h1.title{font-family:var(--f-title);font-weight:400;color:var(--title);margin:.12em 0 .1em;line-height:1.02;
  font-size:calc(clamp(3.5rem,17vw,5.6rem) * var(--title-scale));text-wrap:balance}
h1.title.long{font-size:calc(clamp(2.9rem,13.5vw,4.6rem) * var(--title-scale))}
html[data-kind="fun"] h1.title{font-weight:var(--w-title,700);line-height:1.1}
html[data-kind="lux"] h1.title{text-shadow:0 0 28px rgba(217,191,138,.25)}
.hosts{font-family:var(--f-head);font-size:1.55rem;font-weight:500;margin:.1em 0 0;line-height:1.2}
html[data-kind="lux"] .hosts{font-size:1.15rem;letter-spacing:.16em;text-transform:uppercase;font-weight:400}
.hosts-sub{font-style:italic;color:var(--ink-soft);margin:.1em 0 0}
html[data-kind="lux"] .hosts-sub{font-style:normal;font-weight:300}
.date-line{display:inline-flex;gap:.7em;align-items:center;margin-top:1em;padding:.45em 1.1em;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-family:var(--f-head);letter-spacing:.12em;text-transform:uppercase;font-size:.9rem;font-weight:600}
html[data-kind="fun"] .date-line{border:2px dashed var(--line);border-radius:30px;font-family:var(--f-body);font-weight:400;font-size:1rem}
html[data-kind="lux"] .date-line{font-weight:400;font-size:.76rem;letter-spacing:.24em}
.date-line i{width:4px;height:4px;border-radius:50%;background:var(--gold);flex:none}
.frame{position:relative;width:min(74%,300px);margin:26px auto 8px}
.frame-in{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:999px 999px 8px 8px;border:3px solid var(--gold);
  box-shadow:0 0 0 6px var(--paper),0 0 0 7px var(--line),0 18px 30px -14px rgba(0,0,0,.5);background:var(--scene-bg)}
.frame-in img,.frame-in svg{width:100%;height:100%;object-fit:cover;display:block}
.frame .sprig{position:absolute;width:74px;height:32px;left:50%;bottom:-16px;color:var(--gold);transform:translateX(-50%);z-index:2}
html[data-kind="lux"] .frame-in{border-width:1px;box-shadow:0 0 0 7px var(--paper),0 0 0 8px var(--line),0 0 40px rgba(217,191,138,.18)}
html[data-kind="lux"] .frame .sprig{width:44px;height:44px;bottom:-22px;color:var(--gold)}
html[data-kind="fun"] .frame{transform:rotate(-2.2deg);background:#fffdf7;padding:11px 11px 46px;box-shadow:0 14px 26px -12px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.06);border-radius:3px;width:min(76%,300px)}
html[data-kind="fun"] .frame-in{border-radius:2px;border:0;box-shadow:none;aspect-ratio:1/1}
html[data-kind="fun"] .frame::before{content:"";position:absolute;top:-14px;left:50%;width:104px;height:28px;margin-left:-52px;transform:rotate(-3deg);background:var(--tape);opacity:.92;box-shadow:0 1px 3px rgba(0,0,0,.3);z-index:2}
html[data-kind="fun"] .frame .sprig{bottom:9px;width:74px;height:26px}

/* countdown */
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:10px auto 0}
.count div{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 2px 9px}
html[data-kind="fun"] .count div{border:2px dashed var(--line)}
html[data-kind="fun"] .count div:nth-child(odd){transform:rotate(-1.5deg)}
html[data-kind="fun"] .count div:nth-child(even){transform:rotate(1.5deg)}
.count b{display:block;font-family:var(--f-head);font-size:2.1rem;line-height:1;font-weight:600;color:var(--title);font-variant-numeric:tabular-nums}
html[data-kind="lux"] .count b{font-weight:400;font-size:1.8rem}
.count span{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;color:var(--ink-soft);font-family:var(--f-head)}
html[data-kind="fun"] .count span{font-family:var(--f-body);font-size:.85rem;letter-spacing:.06em}
.count-msg{font-family:var(--f-script);font-size:2.3rem;color:var(--title);line-height:1.2;margin:.2em 0}
html[data-kind="fun"] .count-msg{font-family:var(--f-head);font-weight:700;font-size:1.8rem}

/* details */
.details{display:grid;gap:12px;text-align:left;max-width:440px;margin:0 auto}
.detail{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
html[data-kind="fun"] .detail{border:2px dashed var(--line)}
.ico{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
html[data-kind="soft"] .detail:nth-child(even) .ico{background:var(--accent2)}
html[data-kind="fun"] .detail:nth-child(even) .ico{background:var(--accent2)}
html[data-kind="lux"] .ico{background:none;border:1px solid var(--gold);color:var(--gold)}
.ico svg{width:21px;height:21px}
.detail .label{font-size:.7rem}
html[data-kind="fun"] .detail .label{font-size:.9rem}
.detail strong{display:block;font-family:var(--f-head);font-size:1.28rem;font-weight:600;line-height:1.25}
html[data-kind="lux"] .detail strong{font-size:1rem;font-weight:400;letter-spacing:.06em}
.detail p{margin:.1em 0 0;color:var(--ink-soft);line-height:1.35}
.dots{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.dots i{width:24px;height:24px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line),0 2px 4px rgba(0,0,0,.25)}
.badge{display:inline-flex;align-items:center;gap:.4em;margin-top:9px;padding:.3em .85em;background:var(--accent);color:var(--accent-ink);border-radius:30px;
  font-family:var(--f-head);font-weight:600;font-size:.86rem;letter-spacing:.06em;transform:rotate(-2deg);box-shadow:0 3px 0 rgba(0,0,0,.2)}
html[data-kind="fun"] .badge{font-family:var(--f-body);font-weight:400;font-size:1rem}

/* timeline */
.timeline{list-style:none;margin:0 auto;padding:0;max-width:400px;text-align:left;position:relative}
.timeline::before{content:"";position:absolute;left:99px;top:10px;bottom:10px;width:1px;background:var(--line)}
html[data-kind="fun"] .timeline::before{width:0;border-left:2px dashed var(--line);background:none}
.timeline li{display:grid;grid-template-columns:86px 27px 1fr;align-items:start;padding:8px 0}
.timeline time{font-family:var(--f-head);font-weight:600;color:var(--title);text-align:right;font-size:1.12rem;white-space:nowrap}
html[data-kind="lux"] .timeline time{font-weight:400;font-size:.92rem;letter-spacing:.06em;padding-top:.15em}
.timeline li>i{width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--gold);margin:.42em auto 0;position:relative;z-index:1}
.timeline li:first-child>i{background:var(--gold)}
.timeline strong{font-family:var(--f-head);font-weight:600;font-size:1.18rem;display:block;line-height:1.3}
html[data-kind="lux"] .timeline strong{font-weight:400;font-size:.98rem;letter-spacing:.05em}
.timeline span{color:var(--ink-soft);display:block;line-height:1.3;font-size:.95em}

/* menu */
.menu{max-width:420px;margin:0 auto}
.menu h3{font-family:var(--f-head);font-size:.82rem;letter-spacing:var(--label-space);text-transform:uppercase;color:var(--label);margin:1.1em 0 .25em;font-weight:600}
html[data-kind="fun"] .menu h3{font-family:var(--f-body);font-size:1rem;font-weight:400}
html[data-kind="lux"] .menu h3{font-weight:400;font-size:.72rem}
.menu p{font-style:italic;font-size:1.08em;margin:.1em 0;line-height:1.4}
html[data-kind="lux"] .menu p{font-style:normal;font-weight:300}
html[data-kind="fun"] .menu p{font-style:normal}

/* gift */
.gift{max-width:440px;margin:0 auto;padding:22px 18px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);position:relative}
html[data-kind="fun"] .gift{border:2px dashed var(--line)}
.gift-ico{width:54px;height:54px;margin:-48px auto 6px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.gift-ico svg{width:28px;height:28px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 12px}
.chip{padding:.3em .9em;border:1px solid var(--line);border-radius:30px;background:var(--paper);font-size:.95em;line-height:1.3}
.chip b{font-family:var(--f-head);font-weight:600;color:var(--title)}
.rules{list-style:none;margin:0;padding:0;text-align:left}
.rules li{position:relative;padding:.25em 0 .25em 1.5em;line-height:1.35}
.rules li::before{content:"✦";position:absolute;left:.15em;color:var(--gold);font-size:.8em;top:.5em}

/* buttons */
.btns{display:grid;gap:10px;max-width:440px;margin:0 auto}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:calc(var(--radius) + 30px);padding:.82em 1.2em;
  font-family:var(--f-head);font-weight:600;font-size:1.02rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;display:inline-flex;gap:.6em;align-items:center;justify-content:center;
  min-height:50px;transition:transform .2s ease,box-shadow .2s ease,background .2s;box-shadow:0 6px 14px -8px rgba(0,0,0,.6);text-align:center;line-height:1.2}
html[data-kind="lux"] .btn{border-radius:2px;font-weight:400;font-size:.82rem;letter-spacing:.2em}
html[data-kind="fun"] .btn{font-family:var(--f-body);font-weight:400;font-size:1.12rem;letter-spacing:.04em;text-transform:none;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
html[data-kind="soft"] .btn.green,html[data-kind="fun"] .btn.green{background:var(--accent2);border-color:var(--accent2)}
.btn svg{width:19px;height:19px;flex:none}
.cal-menu{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.cal-menu[hidden]{display:none}
.cal-menu .btn{font-size:.82rem;padding:.6em .5em;min-height:46px}
html[data-kind="fun"] .cal-menu .btn{font-size:1rem}
@media(min-width:560px){.btns{grid-template-columns:1fr 1fr}.cal-menu{grid-column:1/-1}}

/* rsvp */
.rsvp{max-width:440px;margin:0 auto;text-align:left}
.rsvp-note{text-align:center;color:var(--ink-soft);margin:-.3em 0 1em}
.fld{margin:0 0 14px;border:0;padding:0;min-width:0}
.fld>label,.fld>legend{display:block;font-family:var(--f-head);font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--label);margin-bottom:5px;padding:0}
html[data-kind="fun"] .fld>label,html[data-kind="fun"] .fld>legend{font-family:var(--f-body);font-size:.95rem;font-weight:400;letter-spacing:.06em}
html[data-kind="lux"] .fld>label,html[data-kind="lux"] .fld>legend{font-weight:400;font-size:.68rem;letter-spacing:.24em}
.fld input[type=text],.fld textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:min(var(--radius),10px);padding:.6em .8em;font-size:1.05rem;line-height:1.35}
.fld textarea{min-height:74px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--accent)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{position:relative;display:block}
.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.choice span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:72px;padding:.5em;text-align:center;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--field);font-family:var(--f-head);font-weight:600;font-size:1.08rem;line-height:1.2;transition:background .2s,color .2s,transform .2s}
html[data-kind="lux"] .choice span{font-weight:400;font-size:.86rem;letter-spacing:.1em}
.choice em{font-style:normal;font-size:1.3rem;line-height:1}
.choice input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);transform:scale(1.02)}
.choice input:focus-visible+span{outline:3px solid var(--focus);outline-offset:3px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:40px;background:var(--field);overflow:hidden}
.stepper button{all:unset;cursor:pointer;width:48px;height:46px;display:grid;place-items:center;font-size:1.5rem;font-family:Georgia,serif;color:var(--title)}
.stepper button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;border-radius:40px}
.stepper output{min-width:2.2em;text-align:center;font-family:var(--f-head);font-weight:600;font-size:1.3rem}
.rsvp .btn{width:100%;margin-top:4px}
.rsvp-err{color:var(--accent);font-weight:600;text-align:center;min-height:1.4em;margin:.3em 0}
html[data-kind="lux"] .rsvp-err{color:#ffb4a8}
.rsvp-done{text-align:center;padding:10px 0}
.rsvp-done svg{width:86px;height:86px;margin:0 auto 6px;color:var(--accent2)}
.rsvp-done circle{stroke-dasharray:240;stroke-dashoffset:240;animation:draw .8s ease forwards}
.rsvp-done path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rsvp-done h3{font-family:var(--f-script);font-weight:400;font-size:2.3rem;color:var(--title);margin:.1em 0;line-height:1.15}
html[data-kind="fun"] .rsvp-done h3{font-family:var(--f-head);font-weight:700;font-size:1.9rem}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--ink-soft);font-size:.95em;margin-top:.6em;display:inline-block;padding:.3em}
.linkbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}

/* footer */
.closing{max-width:25em;margin:0 auto;font-style:italic;font-size:1.1em}
html[data-kind="lux"] .closing{font-style:normal;font-weight:300}
html[data-kind="fun"] .closing{font-style:normal}
.sign{font-family:var(--f-script);font-size:2.3rem;color:var(--title);margin:.3em 0 0;line-height:1.2}
html[data-kind="fun"] .sign{font-size:2rem}
.foot-art{width:96px;height:42px;margin:14px auto 0;color:var(--gold)}

/* music */
#music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:70;width:50px;height:50px;border-radius:50%;border:1px solid var(--line);
  background:var(--paper);color:var(--title);display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.6);padding:0;transition:transform .2s}
#music[hidden]{display:none}
#music:hover{transform:scale(1.06)}
#music svg{width:22px;height:22px}
#music .off-line{opacity:1;transition:opacity .2s}
#music[aria-pressed="true"] .off-line{opacity:0}
#music[aria-pressed="true"]{animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}

/* ───────────────────────── NEW YEAR CHAMPAGNE EXTRAS ───────────────────────── */
/* champagne bottle (replaces the envelope) */
.env-btn{margin-top:clamp(6px,2vh,24px)}
.env{width:min(46vw,200px);aspect-ratio:.5;perspective:1600px;animation:float 5s ease-in-out infinite}
.env.away{transform:scale(1.1);opacity:0;transition:transform .7s ease,opacity .6s ease}
.env-shadow{bottom:-3%;height:5%;left:14%;right:14%}
.env-letter{left:-38%;right:-38%;top:14%;height:72%;z-index:2;justify-content:center;padding:0 8% 6%;border-radius:8px;opacity:0;transform:scale(.3) translateY(30%);transition:transform .9s cubic-bezier(.3,1.3,.4,1),opacity .4s}
.env-letter small{font-size:6cqw}
.env-letter span{font-family:var(--f-t2);font-style:var(--t2-style);font-size:17cqw!important;line-height:1.05;margin-top:.3em;font-weight:400!important}
.bottle{position:absolute;inset:0;z-index:3;transition:transform .6s ease,opacity .5s}
.bottle svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 18px 18px rgba(0,0,0,.45))}
.seal{left:50%;top:9.5%;width:30%;aspect-ratio:1;z-index:4;transform:translate(-50%,-50%);transition:transform .9s cubic-bezier(.2,.6,.3,1),opacity .6s .35s}
.seal svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.env.open .bottle{animation:shake .32s ease-in-out 2}
.env.open .seal{transform:translate(-50%,-420%) rotate(560deg);opacity:0;transition-delay:.5s,.85s}
.env.open .bottle{transform:translateY(30%) scale(.85);opacity:0;transition-delay:.95s,.95s}
.env.open .env-letter{opacity:1;transform:none;transition-delay:1.05s,1.05s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.env-address{top:62%;bottom:auto;z-index:4;padding:0 26%}
.env-address .tag{display:block;padding:2% 0}
.env-address small{color:var(--label);font-size:5.4cqw;letter-spacing:.12em}
.env-address span{color:var(--ink);font-size:12cqw;white-space:normal;line-height:1.05}
.env.open .env-address{opacity:0}
html[data-theme="neon"] h1.title .t1{text-shadow:0 0 10px rgba(255,79,216,.9),0 0 28px rgba(255,79,216,.6)}
html[data-theme="neon"] h1.title .t2{color:#2ef2ff;text-shadow:0 0 10px rgba(46,242,255,.9),0 0 26px rgba(46,242,255,.5)}
html[data-theme="neon"] .hosts{text-shadow:0 0 12px rgba(255,79,216,.7)}
html[data-theme="disco"] h1.title .t1{background:linear-gradient(90deg,#ff3d9a,#6c4cff,#3ad0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1.title .t1.lg{font-size:calc(clamp(1.45rem,7.2vw,2.6rem) * var(--title-scale))}
.bub{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.4) 60%,transparent 70%);box-shadow:0 0 0 1px rgba(255,255,255,.5);will-change:transform,opacity}
/* hero */
.intro{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.22em;font-size:.82rem;color:var(--label);margin-top:.4em}
h1.title{font-size:inherit;margin:.25em 0 .1em;line-height:1}
h1.title .t1{display:block;font-family:var(--f-title);text-transform:uppercase;font-weight:var(--w-title);letter-spacing:.02em;line-height:1;font-size:calc(clamp(1.85rem,9.6vw,3.3rem) * var(--title-scale));color:var(--title)}
h1.title .t1.solo{font-size:calc(clamp(2.1rem,10.6vw,3.6rem) * var(--title-scale))}
h1.title .t2{display:block;font-family:var(--f-t2);font-style:var(--t2-style);font-weight:var(--t2-weight);font-size:calc(clamp(3rem,15vw,4.8rem) * var(--title-scale));line-height:1.05;color:var(--ink);text-transform:none;letter-spacing:0;margin-top:-.04em}
html[data-kind="lux"] h1.title .t1{text-shadow:0 0 30px rgba(240,207,124,.35)}

let AC=null,musicOn=false,musicTimer=null,mp3=null,master=null;
function ac(){if(!AC){const K=window.AudioContext||window.webkitAudioContext;if(!K)return null;AC=new K()}if(AC.state==="suspended")AC.resume();return AC}

function chime(){const c=ac();if(!c)return;[1318.5,1568,2093,2637].forEach((f,i)=>bell(c,f,c.currentTime+i*.11,.07,1.6))}
const N={"F#5":78,A5:81,C4:60,D4:62,E4:64,F4:65,"F#4":66,G4:67,A4:69,B4:71,C5:72,D5:74,E5:76,F5:77,G5:79};
const ALS="C4 1,F4 1.5,F4 .5,F4 1,A4 1,G4 1.5,F4 .5,G4 1,A4 1,F4 1.5,F4 .5,A4 1,C5 1,D5 3,D5 1,C5 1.5,A4 .5,A4 1,F4 1,G4 1.5,F4 .5,G4 1,A4 1,F4 1.5,D4 .5,D4 1,C4 1,F4 3,D5 1,C5 1.5,A4 .5,A4 1,F4 1,G4 1.5,F4 .5,G4 1,D5 1,C5 1.5,A4 .5,A4 1,C5 1,D5 3,F5 1,C5 1.5,A4 .5,A4 1,F4 1,G4 1.5,F4 .5,G4 1,A4 1,F4 1.5,D4 .5,D4 1,C4 1,F4 3,R 2";
const TUNES={"auld-lang-syne":{bpm:96,n:ALS},"auld-lang-syne-soft":{bpm:72,n:ALS}};
function startBox(){const c=ac();if(!c)return false;const tune=TUNES[(C.music||{}).track]||TUNES["auld-lang-syne"];
  const notes=tune.n.split(",").map(s=>{const[a,b]=s.trim().split(" ");return[a,parseFloat(b)]}),beat=60/tune.bpm;
  master=c.createGain();master.gain.value=.9;master.connect(c.destination);let i=0,t=c.currentTime+.15;
  const tick=()=>{while(t<c.currentTime+.6){const[nm,b]=notes[i];if(nm!=="R"){const f=440*Math.pow(2,(N[nm]+12-69)/12);bell(c,f,t,.085,Math.max(1.1,b*beat*1.6),master);if(b>=1)bell(c,f/2,t,.03,1.4,master)}
    t+=b*beat;i=(i+1)%notes.length}};
  tick();musicTimer=setInterval(tick,200);return true}
function setMusic(v){const b=$("#music"),m=C.music||{};
  if(v){let ok=false;if(m.source==="mp3"&&m.mp3Url){if(!mp3){mp3=new Audio(m.mp3Url);mp3.loop=true;mp3.volume=.5}mp3.play().catch(()=>setMusic(false));ok=true}else ok=startBox();if(!ok)return}
  else{if(mp3)mp3.pause();clearInterval(musicTimer);if(master){try{master.gain.setTargetAtTime(0,AC.currentTime,.15)}catch(e){}master=null}}
  musicOn=v;b.setAttribute("aria-pressed",String(v));b.setAttribute("aria-label",v?"Pause background music":"Play background music")}

/* ───────── garland: hanging stars and mini disco balls ───────── */
const starP=(x,y,r)=>`M${x} ${y-r}L${x+r*.3} ${y-r*.3}L${x+r} ${y}L${x+r*.3} ${y+r*.3}L${x} ${y+r}L${x-r*.3} ${y+r*.3}L${x-r} ${y}L${x-r*.3} ${y-r*.3}Z`;
function drawLights(){$$(".lights").forEach(h=>{const w=Math.max(320,h.clientWidth||innerWidth),seg=w<600?w/2:w/Math.round(w/300),n=Math.round(w/seg),H=w<700?84:92,c=22;
  const Y=t=>2+2*t*(1-t)*(c-2);let p="M0 2",b="",k=0;
  for(let i=0;i<n;i++){const x0=i*seg,m=Math.max(4,Math.round(seg/40));p+=` Q${x0+seg/2} ${c} ${x0+seg} 2`;
    for(let j=0;j<m;j++){const t=(j+.5)/m,x=x0+seg*t,y=Y(t);k++;const len=10+((k*17)%5)*9;
      b+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)}v${len}" stroke="var(--wire)" stroke-width="1" opacity=".75"/>`;
      if(k%3===0){const r=8,cy=y+len+r;b+=`<circle cx="${x.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="var(--b4)"/><path d="M${(x-r).toFixed(1)} ${cy.toFixed(1)}h${2*r}M${x.toFixed(1)} ${(cy-r).toFixed(1)}v${2*r}M${(x-r*.7).toFixed(1)} ${(cy-r*.55).toFixed(1)}h${1.4*r}M${(x-r*.7).toFixed(1)} ${(cy+r*.55).toFixed(1)}h${1.4*r}" stroke="#000" stroke-opacity=".22" stroke-width="1"/><circle cx="${(x-r*.35).toFixed(1)}" cy="${(cy-r*.35).toFixed(1)}" r="2" fill="#fff" opacity=".85"/>`}
      else{const r=k%2?8:6;b+=`<path d="${starP(x,y+len+r,r)}" class="c${k%4+1}"/>`}}}
  h.innerHTML=`<svg viewBox="0 0 ${w} ${H}" preserveAspectRatio="xMidYMin meet" style="overflow:visible"><path class="wire" d="${p}" style="stroke:var(--wire);stroke-width:1.4"/>${b}</svg>`})}

/* ───────── falling confetti & glitter (canvas, capped) ───────── */
const snow=(()=>{const cv=$("#snow"),cx=cv.getContext("2d");let W=0,H=0,fl=[],raf=0,last=0,dpr=1,COLS=["#e0bf68","#ffffff","#9fb4e8","#f5e6b8"];
  const pick=()=>COLS[Math.floor(Math.random()*COLS.length)];
  function colors(){const s=getComputedStyle(document.documentElement),c=["--b1","--b2","--b3","--b4"].map(k=>s.getPropertyValue(k).trim()).filter(Boolean);if(c.length)COLS=c;fl.forEach(f=>f.c=pick())}
  function size(){dpr=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.min(56,Math.round(W*H/18000));while(fl.length<n)fl.push(mk(true));fl.length=n}
  function mk(any){const g=Math.random()<.42;return{x:Math.random()*W,y:any?Math.random()*H:-10,g:g,w:g?1+Math.random()*1.5:3+Math.random()*3,h:g?0:6+Math.random()*5,
    v:g?10+Math.random()*12:16+Math.random()*20,p:Math.random()*6.28,s:.4+Math.random()*.8,r:Math.random()*6.28,vr:(Math.random()-.5)*2.4,f:Math.random()*6.28,c:pick(),a:.45+Math.random()*.45}}
  function frame(t){raf=requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;cx.clearRect(0,0,W,H);
    for(let i=0;i<fl.length;i++){const f=fl[i];f.y+=f.v*dt;f.p+=f.s*dt;f.x+=Math.sin(f.p)*12*dt;f.r+=f.vr*dt;f.f+=dt*4;if(f.y>H+10)fl[i]=mk(false);
      cx.fillStyle=f.c;
      if(f.g){cx.globalAlpha=f.a*(.45+.55*Math.abs(Math.sin(f.f)));cx.beginPath();cx.arc(f.x,f.y,f.w,0,6.283);cx.fill()}
      else{cx.globalAlpha=f.a;cx.save();cx.translate(f.x,f.y);cx.rotate(f.r);cx.scale(1,Math.cos(f.f));cx.fillRect(-f.w/2,-f.h/2,f.w,f.h);cx.restore()}}
    cx.globalAlpha=1}
  function start(){if(reduced||raf)return;last=performance.now();raf=requestAnimationFrame(frame)}
  function stop(){cancelAnimationFrame(raf);raf=0}
  document.addEventListener("visibilitychange",()=>document.hidden?stop():start());
  return{size,start,colors}})();

/* ───────── countdown ───────── */
function tick(){
  const body=$("#count-body");if(!body)return;const s=startDT(),now=new Date(),lab=$("#count-label");
  const sameDay=now.getFullYear()===s.getFullYear()&&now.getMonth()===s.getMonth()&&now.getDate()===s.getDate();
  const dayEnd=new Date(s.getFullYear(),s.getMonth(),s.getDate()+1);
  let state=sameDay?"today":now>=dayEnd?"after":"before";
  if(body.dataset.state!==state){body.dataset.state=state;lab.hidden=state!=="before";
    body.innerHTML=state==="before"?`<div class="count" role="timer" aria-label="Countdown to the event">${["Days","Hours","Minutes","Seconds"].map((l,i)=>`<div><b id="cd${i}">0</b><span>${i===2?"Mins":i===3?"Secs":l}</span></div>`).join("")}</div>`
      :`<p class="count-msg">${esc(state==="today"?ev().today:"Thank you for celebrating with us")}</p>${state==="today"&&C.startTime&&now<s?`<p>Doors open at ${esc(timeOf(s))}</p>`:""}`}
  if(state==="before"){let d=Math.max(0,Math.floor((s-now)/1000));const v=[Math.floor(d/86400),Math.floor(d%86400/3600),Math.floor(d%3600/60),d%60];
    v.forEach((x,i)=>{const e=$("#cd"+i);if(e)e.textContent=i?p2(x):x})}
}

/* ───────── meta tags (kept in sync with CONFIG) ───────── */
function meta(){
  const sh=C.share||{},t=sh.title||(title()+(C.hosts?" · "+C.hosts:"")),s=startDT();
  const d=sh.description||("You're invited!"+(s?" "+longDate()+(C.startTime?" at "+timeOf(s):"")+".":"")+" Tap to open your invitation.");
  document.title=t;const set=(sel,v)=>{const m=$(sel);if(m&&v)m.setAttribute("content",v)};
  set('meta[name="description"]',d);set('meta[property="og:title"]',t);set('meta[property="og:description"]',d);set('meta[name="twitter:title"]',t);set('meta[name="twitter:description"]',d);
  set('meta[name="theme-color"]',getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
}

/* ───────── render ───────── */
let io=null;
function render(){
  const t=theme(),g=guest();document.documentElement.dataset.theme=t;document.documentElement.dataset.kind=KIND[t];
  // envelope
  $("#env-from").innerHTML=C.hosts?`An invitation from<b>${esc(C.hosts)}</b>`:"";
  $("#env-dear").textContent=g?(C.greeting||"Dear"):"A special invitation";
  const nm=$("#env-name");nm.textContent=g||"You're Invited";nm.classList.toggle("long",(g||"").length>20);
  $("#env-letter-small").textContent="You're invited";$("#env-letter-title").textContent=title();
  $("#seal").innerHTML=A.bow;$("#bottle").innerHTML=BOTTLE;
  // card
  const parts=[hero(),countdown(),details(),schedule(),menu(),gift(),know(),buttons(),rsvp(),footer()].filter(Boolean);
  $("#card").innerHTML=(KIND[t]==="lux"?["tl","tr","bl","br"].map(c=>`<div class="corner ${c}">${A.corner}</div>`).join(""):"")+parts.join(divider());
  $("#music").hidden=!(C.music&&C.music.enabled);
  meta();tick();drawLights();snow.colors();observe();
}
function observe(){
  const els=$$(".rv");if(reduced||PREVIEW||!("IntersectionObserver"in window)){els.forEach(e=>e.classList.add("on"));return}
  if(io)io.disconnect();io=new IntersectionObserver(en=>en.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px",threshold:.05});
  els.forEach(e=>io.observe(e));
}

/* ───────── envelope ───────── */
const scr=$("#envelope-screen"),page=$("#page");
function showCard(instant){
  page.hidden=false;document.body.classList.remove("locked");
  if(instant){scr.hidden=true;page.style.transition="none";page.classList.add("in");requestAnimationFrame(()=>page.style.transition="")}
  else{scr.classList.add("done");requestAnimationFrame(()=>requestAnimationFrame(()=>page.classList.add("in")));setTimeout(()=>scr.hidden=true,900)}
  drawLights();observe();
}
let opening=false;
function openEnvelope(){
  if(opening)return;opening=true;const s=C.sounds||{};
  try{if(s.paper!==false)paperSound();if(s.chime!==false)setTimeout(chime,1050)}catch(e){}
  if(reduced){showCard(false);return}
  const env=$("#env"),sr=$("#seal").getBoundingClientRect();
  scr.classList.add("opening");env.classList.add("open");setTimeout(()=>{const q=$("#seal").getBoundingClientRect();burst(q.left+q.width/2,q.top+q.height/2,18);foam(q.left+q.width/2,q.top+q.height/2)},520);
  setTimeout(()=>env.classList.add("away"),2050);
  setTimeout(()=>showCard(false),2250);setTimeout(party,2450);
}

/* ───────── events ───────── */
$("#env-btn").addEventListener("click",openEnvelope);
$("#music").addEventListener("click",()=>setMusic(!musicOn));
$("#card").addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.id==="ornament"){const r=t.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.55,26);starRain(10);t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");try{if((C.sounds||{}).chime!==false)chime()}catch(x){}}
  else if(t.id==="btn-cal"){const m=$("#cal-menu"),o=m.hidden;m.hidden=!o;t.setAttribute("aria-expanded",String(o))}
  else if(t.id==="btn-ics")downloadIcs();
  else if(t.id==="rsvp-link"){const l=(C.rsvp||{}).link;if(l)openUrl(l);rsvpDone("link","","")}
  else if(t.id==="rsvp-again"){$("#rsvp-done").hidden=true;$("#rsvp-form").hidden=false}
  else if(t.dataset.step){const o=$("#r-n"),v=Math.max(1,Math.min(+o.dataset.max,+o.textContent+ +t.dataset.step));o.textContent=v}
});
$("#card").addEventListener("change",e=>{if(e.target.name==="attend"){$("#r-extra").hidden=e.target.value==="no";$("#r-err").textContent=""}});
$("#card").addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="rsvp-form")sendRsvp()});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{snow.size();drawLights()},150)});
setInterval(tick,1000);

// live preview hook used by editor.html
if(PREVIEW)addEventListener("message",e=>{const m=e.data||{};
  if(m.type==="invite:update"&&m.config){C=m.config;if(musicOn)setMusic(false);mp3=null;render()}
  if(m.type==="invite:scroll"){const el=document.getElementById(m.id);if(el&&!page.hidden)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-12,behavior:reduced?"auto":"smooth"})}});

/* ───────── go ───────── */
if(PREVIEW)document.documentElement.classList.add("in-editor");
render();snow.size();snow.start();
if(params.get("preview")==="card"||(PREVIEW&&PREVIEW.mode==="card"))showCard(true);
window.__invite={render,openEnvelope,icsText,party,title,config:()=>C};
})();
</script>
