<style>
/* ───────────────────────── THEMES ───────────────────────── */
:root{
  --f-script:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;
  --f-title:var(--f-script);
  --f-head:"Cormorant Garamond",Georgia,serif;
  --f-body:"Cormorant Garamond",Georgia,serif;
  --body-size:1.2rem; --title-scale:1; --label-space:.22em;
  --bg:#0f3526; --bg-art:radial-gradient(120% 80% at 50% 0%,#1d5a3f 0%,#0f3526 55%,#082318 100%);
  --paper:#fbf5e6; --paper-art:radial-gradient(90% 60% at 20% 0%,#fffaf0 0%,transparent 60%),linear-gradient(#fbf5e6,#f6ecd6);
  --ink:#3a2a20; --ink-soft:#5f4b3d; --title:#9b1c22; --label:#7d5c14;
  --accent:#9b1c22; --accent-ink:#fff8ea; --accent2:#1f5a3a; --gold:#c39b3f; --line:rgba(195,155,63,.55);
  --field:#fffdf6; --panel:rgba(31,90,58,.07);
  --env:#f3e8d0; --env2:#e2d2b0; --env-flap:#f7eeda; --liner:#9b1c22;
  --liner-art:radial-gradient(circle at 50% 50%,rgba(255,220,140,.9) 0 1.2px,transparent 1.6px) 0 0/14px 14px,#8f1a20;
  --seal1:#b3262c; --seal2:#7c1217; --seal-ink:#f3cf7a; --name:#3a2a20; --env-label:#7d5c14;
  --hint:#f6e7c4; --b1:#ffe9a8; --b2:#ff6b5e; --b3:#ffc94d; --b4:#6fdc8c; --wire:#06170f;
  --radius:10px; --focus:#e9b949;
}
html[data-theme="elegant"]{
  --f-script:"Pinyon Script","Snell Roundhand",cursive;
  --f-title:var(--f-script);
  --f-head:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Jost","Helvetica Neue",Arial,sans-serif;
  --body-size:1.02rem; --title-scale:1.02; --label-space:.3em;
  --bg:#05070f; --bg-art:radial-gradient(100% 70% at 50% 0%,#17223f 0%,#0a1020 55%,#04060c 100%);
  --paper:#0d1529; --paper-art:radial-gradient(80% 50% at 50% 0%,#1a2748 0%,transparent 70%),linear-gradient(#0f1830,#0a1122);
  --ink:#f4f1ea; --ink-soft:#c9cbd6; --title:#e6cf9c; --label:#d9bf8a;
  --accent:#d9bf8a; --accent-ink:#0b1122; --accent2:#e6cf9c; --gold:#d9bf8a; --line:rgba(217,191,138,.45);
  --field:#131d37; --panel:rgba(217,191,138,.07);
  --env:#17223f; --env2:#0e1730; --env-flap:#1c294b; --liner:#d9bf8a;
  --liner-art:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 1px,transparent 1px 9px),repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 1px,transparent 1px 9px),linear-gradient(#e2cb98,#b99a5c);
  --seal1:#ecd9a8; --seal2:#a98b4c; --seal-ink:#6d5626; --name:#f4f1ea; --env-label:#d9bf8a;
  --hint:#e6cf9c; --b1:#fff1c9; --b2:#ffe2a1; --b3:#fff7e0; --b4:#ffd98a; --wire:#000;
  --radius:2px; --focus:#fff1c9;
}
html[data-theme="cozy"]{
  --f-script:"Caveat","Bradley Hand",cursive;
  --f-title:"Mountains of Christmas","Caveat",cursive;
  --f-head:"Mountains of Christmas","Caveat",cursive;
  --f-body:"Patrick Hand","Comic Sans MS",cursive;
  --body-size:1.16rem; --title-scale:.82; --label-space:.14em;
  --bg:#5b371f; --bg-art:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,transparent 2px 118px),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 7px),linear-gradient(#7a4b2a,#553319);
  --paper:#f8efdb; --paper-art:linear-gradient(#faf3e2,#f4e8cf);
  --ink:#3d2a1c; --ink-soft:#614936; --title:#a8232a; --label:#2c5a3b;
  --accent:#a8232a; --accent-ink:#fff7e6; --accent2:#2c5a3b; --gold:#b9813a; --line:rgba(168,35,42,.5);
  --field:#fffaf0; --panel:rgba(185,129,58,.12);
  --env:#cfae7c; --env2:#b8935f; --env-flap:#d8b988; --liner:#a8232a;
  --liner-art:var(--tartan);
  --seal1:#b12a30; --seal2:#7d151b; --seal-ink:#ffe9c2; --name:#3d2a1c; --env-label:#5a3418;
  --hint:#ffe9c2; --b1:#ff6b5e; --b2:#7be08f; --b3:#ffc94d; --b4:#fff0c0; --wire:#1c0f06;
  --radius:14px; --focus:#ffc94d;
}
:root{
  --tartan:
    repeating-linear-gradient(0deg,rgba(255,225,150,.55) 0 2px,transparent 2px 44px),
    repeating-linear-gradient(90deg,rgba(255,225,150,.55) 0 2px,transparent 2px 44px),
    repeating-linear-gradient(0deg,transparent 0 12px,rgba(18,62,38,.72) 12px 30px,transparent 30px 44px),
    repeating-linear-gradient(90deg,transparent 0 12px,rgba(18,62,38,.72) 12px 30px,transparent 30px 44px),
    #a8232a;
}

/* ───────────────────────── BASE ───────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:var(--body-size);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:var(--bg-art);z-index:-1}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;opacity:.85}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.spark{position:absolute;width:14px;height:14px;will-change:transform,opacity;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.spark.dot{clip-path:none;border-radius:50%;width:7px;height:7px}
.spark.conf{clip-path:none;border-radius:2px;width:8px;height:13px}

/* string lights */
.lights{position:absolute;top:0;left:0;width:100%;height:64px;pointer-events:none;z-index:3;overflow:hidden}
.lights svg{width:100%;height:64px}
.lights .wire{fill:none;stroke:var(--wire);stroke-width:1.6;opacity:.85}
.bulb{animation:twinkle 2.6s ease-in-out infinite}
.bulb:nth-child(4n+1){animation-delay:-.4s;animation-duration:3.1s}
.bulb:nth-child(4n+2){animation-delay:-1.3s}
.bulb:nth-child(4n+3){animation-delay:-2s;animation-duration:3.6s}
.bulb:nth-child(5n){animation-delay:-.9s;animation-duration:2.2s}
.bulb .glow{opacity:.28}
.bulb .cap{fill:#2a2a2a}
.c1{fill:var(--b1)}.c2{fill:var(--b2)}.c3{fill:var(--b3)}.c4{fill:var(--b4)}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}

/* ───────────────────────── ENVELOPE SCREEN ───────────────────────── */
#envelope-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(18px,4vh,36px);padding:80px 16px 40px;background:var(--bg-art),var(--bg);transition:opacity .7s ease,visibility 0s .7s}
#envelope-screen.done{opacity:0;visibility:hidden;pointer-events:none}
#envelope-screen[hidden]{display:none}
.env-from{font-family:var(--f-head);letter-spacing:var(--label-space);text-transform:uppercase;font-size:.78rem;color:var(--hint);
  text-align:center;margin:0;opacity:.9}
.env-from b{display:block;font-weight:400;font-family:var(--f-script);font-size:2.1rem;letter-spacing:0;text-transform:none;margin-top:.1em;line-height:1.15}
html[data-theme="cozy"] .env-from b{font-family:var(--f-title);font-size:1.8rem}
.env-btn{all:unset;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:10px;margin-top:clamp(40px,11vh,110px)}
.env-btn:focus-visible{outline:3px solid var(--focus);outline-offset:10px}
.env{position:relative;width:min(88vw,430px);aspect-ratio:1.42;perspective:1400px;container-type:inline-size;
  animation:float 5s ease-in-out infinite;transition:transform .8s cubic-bezier(.5,0,.3,1)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-8px) rotate(.6deg)}}
.env-shadow{position:absolute;left:6%;right:6%;bottom:-9%;height:10%;background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);z-index:0}
.env-back{position:absolute;inset:0;background:var(--env2);border-radius:7px;z-index:1}
.env-inside{position:absolute;inset:0;z-index:1;border-radius:7px;background:var(--liner-art);clip-path:polygon(0 0,100% 0,100% 60%,0 60%);opacity:.96}
.env-letter{position:absolute;left:6%;right:6%;top:7%;height:86%;z-index:2;background:var(--paper-art),var(--paper);border-radius:4px;
  box-shadow:0 2px 10px rgba(0,0,0,.25);transition:transform .85s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;align-items:center;
  padding-top:9%;text-align:center;color:var(--ink);overflow:hidden}
.env-letter::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:2px}
.env-letter small{font-family:var(--f-head);letter-spacing:var(--label-space);text-transform:uppercase;font-size:11px;font-size:2.9cqw;color:var(--label)}
.env-letter span{font-family:var(--f-title);color:var(--title);font-size:30px;font-size:9.2cqw;line-height:1.05;margin-top:.15em;padding:0 8%}
html[data-theme="cozy"] .env-letter span{font-size:7.4cqw}
.env-front{position:absolute;inset:0;z-index:3;border-radius:7px;
  background:linear-gradient(115deg,transparent 49.6%,rgba(0,0,0,.10) 50%,transparent 53%) 0 0/50% 100% no-repeat,
             linear-gradient(-115deg,transparent 49.6%,rgba(0,0,0,.10) 50%,transparent 53%) 100% 0/50% 100% no-repeat,
             linear-gradient(var(--env),var(--env2));
  clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
html[data-theme="cozy"] .env-front{background:repeating-linear-gradient(0deg,rgba(90,50,20,.08) 0 1px,transparent 1px 4px),
  linear-gradient(115deg,transparent 49.6%,rgba(0,0,0,.12) 50%,transparent 53%) 0 0/50% 100% no-repeat,linear-gradient(-115deg,transparent 49.6%,rgba(0,0,0,.12) 50%,transparent 53%) 100% 0/50% 100% no-repeat,linear-gradient(var(--env),var(--env2))}
html[data-theme="cozy"] .flap-out{background:repeating-linear-gradient(0deg,rgba(90,50,20,.08) 0 1px,transparent 1px 4px),linear-gradient(var(--env-flap),var(--env))}
.env-flap{position:absolute;inset:0;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.45,.05,.25,1),z-index 0s .38s}
.env-flap>i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 60%);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7px}
.flap-out{background:linear-gradient(var(--env-flap),var(--env))}
.flap-out::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.14))}
.flap-in{background:var(--liner-art);transform:rotateX(180deg)}
.env-address{position:absolute;left:0;right:0;top:67%;z-index:4;text-align:center;color:var(--name);padding:0 9%;transition:opacity .4s}
.env-address small{display:block;font-family:var(--f-head);letter-spacing:var(--label-space);text-transform:uppercase;font-size:10px;font-size:2.8cqw;color:var(--env-label)}
.env-address span{display:block;font-family:var(--f-script);font-size:28px;font-size:8.6cqw;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.1em 0}
.env-address span.long{font-size:6.4cqw}
html[data-theme="cozy"] .env-address span{font-weight:700}
/* wax seal */
.seal{position:absolute;left:50%;top:57%;width:21%;aspect-ratio:1;z-index:6;transform:translate(-50%,-50%)}
.seal-half{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,.6,.3,1),opacity .5s .12s}
.seal-half.l{clip-path:polygon(-20% -20%,52% -20%,44% 22%,56% 40%,45% 60%,55% 80%,49% 120%,-20% 120%)}
.seal-half.r{clip-path:polygon(52% -20%,120% -20%,120% 120%,49% 120%,55% 80%,45% 60%,56% 40%,44% 22%)}
.wax{position:absolute;inset:0;border-radius:47% 53% 50% 50%/52% 47% 53% 48%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.45),transparent 30%),radial-gradient(circle at 50% 50%,var(--seal1) 0 58%,var(--seal2) 100%);
  box-shadow:0 3px 7px rgba(0,0,0,.4),inset 0 -3px 6px rgba(0,0,0,.25)}
.wax::before{content:"";position:absolute;inset:13%;border-radius:50%;box-shadow:inset 0 2px 3px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.25);background:radial-gradient(circle,var(--seal1),var(--seal2) 130%)}
.wax svg{position:absolute;inset:24%;width:52%;height:52%;color:var(--seal-ink);filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
html[data-theme="cozy"] .seal::before{content:"";position:absolute;left:-190%;right:-190%;top:44%;height:12%;background:repeating-linear-gradient(90deg,#e9dcc0 0 3px,#c9b792 3px 6px);box-shadow:0 1px 2px rgba(0,0,0,.3);z-index:-1;transition:opacity .3s}
.env.open .seal::before{opacity:0!important}
.env.open .seal-half.l{transform:translate(-42%,26%) rotate(-24deg);opacity:0}
.env.open .seal-half.r{transform:translate(42%,26%) rotate(24deg);opacity:0}
.env.open{animation:none}
.env.open .env-flap{transform:rotateX(180deg);z-index:1;transition-delay:.3s,.68s}
.env.open .env-letter{transform:translateY(-58%);transition-delay:.95s}
.env.open .env-address{opacity:.0}
.env.away{transform:translateY(26vh) scale(.9)}
.tap-hint{font-family:var(--f-head);letter-spacing:var(--label-space);text-transform:uppercase;font-size:.85rem;color:var(--hint);margin:0;
  animation:pulse 2s ease-in-out infinite;transition:opacity .3s}
@keyframes pulse{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
#envelope-screen.opening .tap-hint,#envelope-screen.opening .env-from{opacity:0;animation:none}

/* ───────────────────────── CARD ───────────────────────── */
#page{position:relative;padding:78px 12px 56px;opacity:0;transform:translateY(34px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
#page.in{opacity:1;transform:none}
#page[hidden]{display:none}
.card{position:relative;z-index:2;max-width:600px;margin:0 auto;background:var(--paper-art),var(--paper);border-radius:var(--radius);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.08) inset;padding:30px 24px 34px;text-align:center}
.card::before{content:"";position:absolute;inset:9px;border:1px solid var(--line);border-radius:calc(var(--radius) - 3px);pointer-events:none}
.card::after{content:"";position:absolute;inset:13px;border:1px solid var(--line);opacity:.5;border-radius:calc(var(--radius) - 5px);pointer-events:none}
html[data-theme="cozy"] .card{padding-top:58px;padding-bottom:62px}
html[data-theme="cozy"] .card::before{border:2px dashed var(--line);inset:38px 10px}
html[data-theme="cozy"] .card::after{display:none}
.band{position:absolute;left:0;right:0;height:28px;background:var(--tartan);pointer-events:none;box-shadow:0 2px 4px rgba(0,0,0,.18)}
.band.t{top:0;border-radius:var(--radius) var(--radius) 0 0}.band.b{bottom:0;border-radius:0 0 var(--radius) var(--radius);box-shadow:0 -2px 4px rgba(0,0,0,.18)}
html[data-theme="elegant"] .card{border:1px solid var(--line)}
.corner{position:absolute;width:74px;height:74px;color:var(--gold);pointer-events:none;z-index:1}
.corner.tl{top:4px;left:4px}.corner.tr{top:4px;right:4px;transform:scaleX(-1)}
.corner.bl{bottom:4px;left:4px;transform:scaleY(-1)}.corner.br{bottom:4px;right:4px;transform:scale(-1)}
section{position:relative;padding:8px 0}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
html.in-editor .rv{opacity:1;transform:none;transition:none}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:22px auto;color:var(--gold);max-width:340px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.divider::after{transform:scaleX(-1)}
html[data-theme="cozy"] .divider::before,html[data-theme="cozy"] .divider::after{height:0;background:none;border-top:2px dashed var(--line)}
.divider svg{width:64px;height:28px;flex:none}
.label{font-family:var(--f-head);text-transform:uppercase;letter-spacing:var(--label-space);font-size:.8rem;font-weight:600;color:var(--label);margin:0}
html[data-theme="elegant"] .label{font-size:.7rem;font-weight:400}
html[data-theme="cozy"] .label{font-family:var(--f-body);font-size:.95rem;font-weight:400}
h2.sec{font-family:var(--f-script);font-weight:400;font-size:2.5rem;line-height:1.1;margin:.1em 0 .5em;color:var(--title)}
html[data-theme="cozy"] h2.sec{font-family:var(--f-head);font-weight:700;font-size:2rem}
p{margin:.4em 0}

/* hero */
.ornament{all:unset;cursor:pointer;display:block;width:58px;margin:-30px auto 6px;position:relative;transform-origin:50% 0;animation:swing 4.5s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
html[data-theme="cozy"] .ornament{margin-top:-20px}
.ornament:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:12px}
.ornament svg{width:58px;height:96px;overflow:visible}
.ornament.pop svg{animation:pop .5s ease}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes pop{40%{transform:scale(1.22)}}
.dear{font-family:var(--f-script);font-size:2rem;color:var(--ink);margin:0 0 .2em;line-height:1.15}
html[data-theme="cozy"] .dear{font-weight:700}
.intro{max-width:24em;margin:0 auto}
h1.title{font-family:var(--f-title);font-weight:400;color:var(--title);margin:.12em 0 .1em;line-height:1.02;
  font-size:calc(clamp(3.5rem,17vw,5.6rem) * var(--title-scale));text-wrap:balance}
h1.title.long{font-size:calc(clamp(2.9rem,13.5vw,4.6rem) * var(--title-scale))}
html[data-theme="cozy"] h1.title{font-weight:700;line-height:1.08}
html[data-theme="elegant"] h1.title{text-shadow:0 0 28px rgba(217,191,138,.25)}
.hosts{font-family:var(--f-head);font-size:1.55rem;font-weight:500;margin:.1em 0 0;line-height:1.2}
html[data-theme="elegant"] .hosts{font-size:1.15rem;letter-spacing:.16em;text-transform:uppercase;font-weight:400}
.hosts-sub{font-style:italic;color:var(--ink-soft);margin:.1em 0 0}
html[data-theme="elegant"] .hosts-sub{font-style:normal;font-weight:300}
.date-line{display:inline-flex;gap:.7em;align-items:center;margin-top:1em;padding:.45em 1.1em;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-family:var(--f-head);letter-spacing:.12em;text-transform:uppercase;font-size:.9rem;font-weight:600}
html[data-theme="cozy"] .date-line{border:2px dashed var(--line);border-radius:30px;font-family:var(--f-body);font-weight:400;font-size:1rem}
html[data-theme="elegant"] .date-line{font-weight:400;font-size:.76rem;letter-spacing:.24em}
.date-line i{width:4px;height:4px;border-radius:50%;background:var(--gold);flex:none}

  "Christmas Dinner":{title:"Christmas Dinner",intro:"Please join us around the table for",today:"Christmas dinner is today! 🎄",until:"Until dinner is served"},
  "Christmas Eve":{title:"Christmas Eve",intro:"Come and share a magical evening with us on",today:"It's Christmas Eve, see you tonight! 🎄",until:"Until Christmas Eve"},
  "Holiday Party":{title:"Holiday Party",intro:"Eat, drink & be merry! Join us for our",today:"The party is today! 🎄",until:"Until the party begins"},
  "Office Holiday Party":{title:"Office Holiday Party",intro:"The team is celebrating! You're invited to the",today:"The party is today! 🎄",until:"Until the party begins"},
  "Ugly Sweater Party":{title:"Ugly Sweater Party",intro:"Dig out your tackiest knit and join us for an",today:"The party is today! 🎄",until:"Until the sweaters come out"}
};
const THEMES=["classic","elegant","cozy"];
const ev=()=>EVENTS[C.eventType]||EVENTS["Christmas Party"];
const theme=()=>{const t=(params.get("theme")||"").toLowerCase();return THEMES.includes(t)?t:(THEMES.includes(C.theme)?C.theme:"classic")};
const title=()=>C.title||ev().title;
const on=k=>!C.sections||C.sections[k]!==false;
const urlGuest=()=>String(params.get("guest")||params.get("to")||(PREVIEW&&PREVIEW.guest)||"").replace(/[<>]/g,"").replace(/\s+/g," ").trim().slice(0,60);
const guest=()=>{let g=(params.get("guest")||params.get("to")||(PREVIEW&&PREVIEW.guest)||C.defaultGuest||"").replace(/[<>]/g,"").replace(/\s+/g," ").trim();return g.slice(0,60)};

/* ───────── dates ───────── */
function parseDT(d,t){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");if(!m)return null;const tm=/^(\d{1,2}):(\d{2})/.exec(t||"")||[0,0,0];
  return new Date(+m[1],+m[2]-1,+m[3],+tm[1],+tm[2],0)}
const startDT=()=>parseDT(C.date,C.startTime||"00:00");
function endDT(){const s=startDT();if(!s)return null;if(!C.endTime)return new Date(s.getTime()+3*3600e3);const e=parseDT(C.date,C.endTime);if(e<=s)e.setDate(e.getDate()+1);return e}
const loc=()=>C.locale||"en-US";
function fmt(d,o){try{return d.toLocaleString(loc(),o)}catch(e){return d.toLocaleString("en-US",o)}}
const longDate=()=>{const s=startDT();return s?fmt(s,{weekday:"long",month:"long",day:"numeric",year:"numeric"}):""};
const timeOf=d=>fmt(d,{hour:"numeric",minute:"2-digit"});
const timeRange=()=>{const s=startDT();if(!s||!C.startTime)return"";return timeOf(s)+(C.endTime?" – "+timeOf(endDT()):"")};
const p2=n=>String(n).padStart(2,"0");
const stamp=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+"T"+p2(d.getHours())+p2(d.getMinutes())+"00";

/* ───────── sections ───────── */
function hero(){
  const g=guest(),t=theme(),ti=title(),s=startDT();
  const photo=on("photo")?`<div class="frame"><div class="frame-in">${C.photo?`<img src="${esc(C.photo)}" alt="${esc(C.photoAlt||C.hosts||"Your hosts")}">`:A.scene}</div><div class="sprig">${t==="elegant"?A.star8:A.holly}</div></div>`:"";
  return `<section id="hero" class="rv">
    <button class="ornament" id="ornament" type="button" aria-label="Tap for a little Christmas sparkle">${ORN[t]}</button>
    ${g?`<p class="dear">${esc(C.greeting||"Dear")} ${esc(g)},</p>`:""}
    <p class="intro">${esc(C.intro||ev().intro)}</p>
    <h1 class="title${ti.length>17?" long":""}">${esc(ti)}</h1>
    ${C.hosts?`<p class="label" style="margin-top:.9em">${esc(C.hostsLabel||"Hosted by")}</p><p class="hosts">${esc(C.hosts)}</p>`:""}
    ${C.hostsNames?`<p class="hosts-sub">${esc(C.hostsNames)}</p>`:""}
    ${photo}
    ${s?`<div><p class="date-line"><span>${esc(fmt(s,{weekday:"short"}))}</span><i></i><span>${esc(fmt(s,{month:"short",day:"numeric"}))}</span><i></i><span>${esc(C.startTime?timeOf(s):String(s.getFullYear()))}</span></p></div>`:""}
  </section>`;
}
function countdown(){
  if(!on("countdown")||!startDT())return"";
  return `<section id="countdown" class="rv"><p class="label" id="count-label">${esc(ev().until)}</p><div id="count-body" aria-live="off"></div></section>`;
}
function details(){
  if(!on("details"))return"";
  const d=C.dressCode||{},rows=[];
  if(startDT())rows.push(`<div class="detail"><div class="ico">${A.cal}</div><div><p class="label">When</p><strong>${esc(longDate())}</strong>${timeRange()?`<p>${esc(timeRange())}</p>`:""}</div></div>`);
  if(C.venue||C.address)rows.push(`<div class="detail"><div class="ico">${A.pin}</div><div><p class="label">Where</p><strong>${esc(C.venue||C.address)}</strong>${C.venue&&C.address?`<p>${nl(C.address)}</p>`:""}</div></div>`);
  if(on("dressCode")&&(d.text||d.uglySweaterBadge||(d.palette||[]).length)){
    const dots=(d.palette||[]).filter(x=>/^#[0-9a-f]{3,8}$/i.test(x));
    rows.push(`<div class="detail"><div class="ico">${A.shirt}</div><div><p class="label">Dress code</p>${d.text?`<strong>${esc(d.text)}</strong>`:""}${d.note?`<p>${esc(d.note)}</p>`:""}
      ${dots.length?`<div class="dots" role="img" aria-label="Suggested colours">${dots.map(x=>`<i style="background:${x}"></i>`).join("")}</div>`:""}
      ${d.uglySweaterBadge?`<span class="badge">🧶 Ugly sweater required!</span>`:""}</div></div>`);
  }
  if(!rows.length)return"";
  return `<section id="details" class="rv"><p class="label">The details</p><h2 class="sec">Save the Date</h2><div class="details">${rows.join("")}</div></section>`;
}
function schedule(){
  const L=(C.schedule||[]).filter(x=>x&&(x.time||x.title));
  if(!on("schedule")||!L.length)return"";
  return `<section id="schedule" class="rv"><p class="label">The evening</p><h2 class="sec">What's Planned</h2><ol class="timeline">${L.map(x=>`<li><time>${esc(x.time)}</time><i></i><div><strong>${esc(x.title)}</strong>${x.note?`<span>${esc(x.note)}</span>`:""}</div></li>`).join("")}</ol></section>`;
}
function menu(){
  const L=(C.menu||[]).filter(x=>x&&(x.course||x.dishes));
  if(!on("menu")||!L.length)return"";
  return `<section id="menu" class="rv"><p class="label">On the table</p><h2 class="sec">The Menu</h2><div class="menu">${L.map(x=>`<h3>${esc(x.course)}</h3>${String(x.dishes||"").split("\n").filter(Boolean).map(l=>`<p>${esc(l)}</p>`).join("")}`).join("")}</div></section>`;
}
function gift(){
  const g=C.giftExchange||{};
  if(!on("giftExchange")||!(g.title||g.budget||(g.rules||[]).length))return"";
  const rules=(g.rules||[]).filter(Boolean);
  return `<section id="giftExchange" class="rv"><p class="label">Gift exchange</p><h2 class="sec">${esc(g.title||"Secret Santa")}</h2><div class="gift" style="margin-top:34px"><div class="gift-ico">${A.gift}</div>
    ${g.intro?`<p>${esc(g.intro)}</p>`:""}
    <div class="chips">${g.budget?`<span class="chip">Budget <b>${esc(g.budget)}</b></span>`:""}${g.drawDate?`<span class="chip">Names drawn <b>${esc(g.drawDate)}</b></span>`:""}</div>
    ${rules.length?`<ul class="rules">${rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}</div></section>`;
}
function buttons(){
  const dir=on("directions")&&(C.address||C.mapsLink||C.venue),cal=on("calendar")&&startDT();
  if(!dir&&!cal)return"";
  return `<section id="buttons" class="rv"><div class="btns">
    ${dir?`<a class="btn green" id="btn-dir" href="${esc(mapsUrl())}" target="_blank" rel="noopener">${A.nav}Get directions</a>`:""}
    ${cal?`<button class="btn ghost" id="btn-cal" type="button" aria-expanded="false" aria-controls="cal-menu">${A.cal}Add to calendar</button>
    <div class="cal-menu" id="cal-menu" hidden><button class="btn ghost" id="btn-ics" type="button">Apple / Outlook</button><a class="btn ghost" id="btn-gcal" href="${esc(gcalUrl())}" target="_blank" rel="noopener">Google Calendar</a></div>`:""}
  </div></section>`;
}
function rsvp(){
  if(!on("rsvp"))return"";
  const r=C.rsvp||{},g=urlGuest(),max=Math.max(1,Math.min(20,parseInt(r.maxGuests,10)||6));
  const note=r.deadline?`<p class="rsvp-note">Kindly reply by ${esc(r.deadline)}</p>`:"";
  let body;
  if(r.method==="link"){
    body=`${note}<div id="rsvp-form"><p style="text-align:center">Tap below to let us know if you can make it.</p><button class="btn" id="rsvp-link" type="button">${A.send}RSVP now</button></div>`;
  }else{
    body=`${note}<form id="rsvp-form" novalidate>
      <div class="fld"><label for="r-name">Your name</label><input id="r-name" type="text" autocomplete="name" value="${esc(g)}" maxlength="80"></div>
      <fieldset class="fld"><legend>Will you join us?</legend><div class="choices">
        <label class="choice"><input type="radio" name="attend" value="yes"><span><em aria-hidden="true">🎄</em>Joyfully accepts</span></label>

  if(!name){err.textContent="Please add your name so we know who's replying.";$("#r-name").focus();return}
  if(!att){err.textContent="Please choose if you can join us.";$("input[name=attend]").focus();return}
  err.textContent="";

  if(yes){lines.push("Guests: "+n);if(diet)lines.push("Dietary notes: "+diet)}

  else openUrl("https://wa.me/"+String(r.whatsapp||"").replace(/\D/g,"")+"?text="+encodeURIComponent(text));

const fx=$("#fx");

function burst(x,y,n){
  if(reduced)n=Math.min(n||0,6);const cols=fxColors();
  for(let i=0;i<(n||22);i++){const el=document.createElement("i"),a=Math.random()*Math.PI*2,d=40+Math.random()*95,sz=.5+Math.random()*1.1;
    el.className="spark"+(i%4===0?" dot":"");el.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%cols.length]}`;fx.appendChild(el);

      {duration:700+Math.random()*700,easing:"cubic-bezier(.15,.7,.3,1)",fill:"forwards"}).onfinish=()=>el.remove()}
}

  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(.35+.65*Math.random());
  [[0,.26,1800,.11],[.3,.42,2600,.09]].forEach(([at,dur,f,v])=>{const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+at;
    s.buffer=buf;bp.type="bandpass";bp.Q.value=.8;bp.frequency.setValueAtTime(f*.6,t);bp.frequency.exponentialRampToValueAtTime(f*1.7,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+dur*.3);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(bp);bp.connect(g);g.connect(c.destination);s.start(t);s.stop(t+dur+.05)})}

const N={C4:60,D4:62,E4:64,F4:65,"F#4":66,G4:67,A4:69,B4:71,C5:72,D5:74,E5:76,F5:77,G5:79};

  "silent-night":{bpm:84,n:"G4 1.5,A4 .5,G4 1,E4 3,G4 1.5,A4 .5,G4 1,E4 3,D5 2,D5 1,B4 3,C5 2,C5 1,G4 3,A4 2,A4 1,C5 1.5,B4 .5,A4 1,G4 1.5,A4 .5,G4 1,E4 3,A4 2,A4 1,C5 1.5,B4 .5,A4 1,G4 1.5,A4 .5,G4 1,E4 3,D5 2,D5 1,F5 1.5,D5 .5,B4 1,C5 3,E5 3,C5 1.5,G4 .5,E4 1,G4 1.5,F4 .5,D4 1,C4 5,R 1"},

};
function startBox(){const c=ac();if(!c)return false;const tune=TUNES[(C.music||{}).track]||TUNES["silent-night"];
  const notes=tune.n.split(",").map(s=>{const[a,b]=s.trim().split(" ");return[a,parseFloat(b)]}),beat=60/tune.bpm;
  master=c.createGain();master.gain.value=.9;master.connect(c.destination);let i=0,t=c.currentTime+.15;
  const tick=()=>{while(t<c.currentTime+.6){const[nm,b]=notes[i];if(nm!=="R"){const f=440*Math.pow(2,(N[nm]+12-69)/12);bell(c,f,t,.085,Math.max(1.1,b*beat*1.6),master);if(b>=1)bell(c,f/2,t,.03,1.4,master)}
    t+=b*beat;i=(i+1)%notes.length}};

  else{if(mp3)mp3.pause();clearInterval(musicTimer);if(master){try{master.gain.setTargetAtTime(0,AC.currentTime,.15)}catch(e){}master=null}}

    for(let j=1;j<=3;j++){const t=j/4,x=x0+seg*t,y=5+2*t*(1-t)*(dip*2-10);k++;b+=`<g class="bulb"><circle class="glow c${k%4+1}" cx="${x}" cy="${y+9}" r="13"/><rect class="cap" x="${x-2.500}" y="${y-1}" width="5" height="5" rx="1"/><ellipse class="c${k%4+1}" cx="${x}" cy="${y+9.500}" rx="4.500" ry="6.500"/></g>`}}

/* ───────── snow (canvas, capped) ───────── */
const snow=(()=>{const cv=$("#snow"),cx=cv.getContext("2d");let W=0,H=0,fl=[],raf=0,last=0,dpr=1;
  function size(){dpr=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.min(70,Math.round(W*H/16000));while(fl.length<n)fl.push(mk(true));fl.length=n}
  function mk(any){const r=.8+Math.random()*2.4;return{x:Math.random()*W,y:any?Math.random()*H:-6,r:r,v:14+r*13+Math.random()*10,p:Math.random()*6.28,s:.4+Math.random()*.8,a:.35+Math.random()*.55}}
  function frame(t){raf=requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;cx.clearRect(0,0,W,H);cx.fillStyle="#fff";
    for(let i=0;i<fl.length;i++){const f=fl[i];f.y+=f.v*dt;f.p+=f.s*dt;f.x+=Math.sin(f.p)*14*dt;if(f.y>H+6)fl[i]=mk(false);
      cx.globalAlpha=f.a;cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fill()}}
  function start(){if(reduced||raf)return;last=performance.now();raf=requestAnimationFrame(frame)}

/* ───────── countdown ───────── */
function tick(){
  const body=$("#count-body");if(!body)return;const s=startDT(),now=new Date(),lab=$("#count-label");
  const sameDay=now.getFullYear()===s.getFullYear()&&now.getMonth()===s.getMonth()&&now.getDate()===s.getDate();
  const dayEnd=new Date(s.getFullYear(),s.getMonth(),s.getDate()+1);
  let state=sameDay?"today":now>=dayEnd?"after":"before";
  if(body.dataset.state!==state){body.dataset.state=state;lab.hidden=state!=="before";
    body.innerHTML=state==="before"?`<div class="count" role="timer" aria-label="Countdown to the event">${["Days","Hours","Minutes","Seconds"].map((l,i)=>`<div><b id="cd${i}">0</b><span>${i===2?"Mins":i===3?"Secs":l}</span></div>`).join("")}</div>`
      :`<p class="count-msg">${esc(state==="today"?ev().today:"Thank you for celebrating with us")}</p>${state==="today"&&C.startTime&&now<s?`<p>Doors open at ${esc(timeOf(s))}</p>`:""}`}
  if(state==="before"){let d=Math.max(0,Math.floor((s-now)/1000));const v=[Math.floor(d/86400),Math.floor(d%86400/3600),Math.floor(d%3600/60),d%60];
    v.forEach((x,i)=>{const e=$("#cd"+i);if(e)e.textContent=i?p2(x):x})}
}
