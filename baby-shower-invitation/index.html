<!DOCTYPE html>
<html lang="en" data-theme="girl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%A7%B8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* ───────────────────────── THEMES ───────────────────────── */
:root{
  --f-script:"Great Vibes","Snell Roundhand",cursive;
  --f-head:"Cormorant Garamond",Georgia,serif;
  --f-caps:"Cinzel","Trajan Pro",Georgia,serif;
  --body-size:1.2rem;
  --bg:#f4d3da; --bg-art:radial-gradient(120% 80% at 50% 0%,#fdeef1 0%,#f6d5dc 45%,#eab7c3 100%);
  --paper:#fffaf8; --paper2:#fdf0f2; --ink:#4a3437; --ink-soft:#7d6165; --title:#c0566f; --label:#bf9858;
  --accent:#d97b92; --accent2:#c0566f; --accent-ink:#fff; --gold:#c9a36a; --line:rgba(217,123,146,.38); --field:#fffdfc;
  --ging:rgba(233,145,165,.28);
  --env:#f8d7df; --env2:#efbdc9; --env-flap:#fbe4e9; --env-ink:#b04f68; --env-label:#bf9858;
  --hint:#a5546a; --focus:#c0566f;
}
html[data-theme="boy"]{
  --bg:#d3e3f1; --bg-art:radial-gradient(120% 80% at 50% 0%,#eef5fb 0%,#d6e6f3 45%,#adc8e2 100%);
  --paper:#fdfdfb; --paper2:#eef4fa; --ink:#2f3d4f; --ink-soft:#5d6b7d; --title:#4a7db3; --label:#b39a68;
  --accent:#6b9bcc; --accent2:#4a7db3; --line:rgba(107,155,204,.38); --field:#fdfefe;
  --ging:rgba(120,165,210,.26);
  --env:#d6e5f3; --env2:#bbd2ea; --env-flap:#e4eef8; --env-ink:#3f6a99; --env-label:#b39a68;
  --hint:#3f6a99; --focus:#4a7db3;
}

/* ───────────────────────── BASE ───────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f-head);font-size:var(--body-size);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:var(--bg-art);z-index:-1}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
svg{display:block}
p{margin:.4em 0}
.ging{background-color:var(--paper2);background-image:linear-gradient(90deg,var(--ging) 50%,transparent 50%),linear-gradient(var(--ging) 50%,transparent 50%);background-size:26px 26px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.pt{position:absolute;width:16px;height:16px;will-change:transform,opacity}
#float{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ───────────────────────── ENVELOPE ───────────────────────── */
#envelope-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);padding:40px 16px;background:var(--bg-art),var(--bg);transition:opacity .8s ease,visibility 0s .8s;overflow:hidden}
#envelope-screen.done{opacity:0;visibility:hidden;pointer-events:none}
#envelope-screen[hidden]{display:none}
.env-bunting{position:absolute;left:0;right:0;top:0;height:70px;pointer-events:none}
.env-balloons{position:absolute;right:-6px;top:-24px;width:118px;pointer-events:none;animation:sway 6s ease-in-out infinite;transform-origin:50% 100%}
.env-balloons.l{left:-20px;right:auto;top:auto;bottom:40px;width:120px;animation-delay:-2s}
@keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-8px)}}
.env-top{text-align:center;color:var(--hint);margin:0;position:relative;z-index:2}
.env-top small{display:block;font-family:var(--f-caps);letter-spacing:.3em;text-transform:uppercase;font-size:.72rem}
.env-top b{display:block;font-weight:400;font-family:var(--f-script);font-size:3.1rem;line-height:1.1;margin-top:.1em;color:var(--title)}
.env-btn{all:unset;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:10px;margin-top:clamp(30px,9vh,90px);position:relative;z-index:2}
.env-btn:focus-visible{outline:3px solid var(--focus);outline-offset:10px}
.env{position:relative;width:min(88vw,430px);aspect-ratio:1.42;perspective:1400px;container-type:inline-size;animation:float 6s ease-in-out infinite;transition:transform .8s cubic-bezier(.5,0,.3,1)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.env-shadow{position:absolute;left:6%;right:6%;bottom:-9%;height:10%;background:radial-gradient(closest-side,rgba(120,60,80,.35),transparent);z-index:0}
.env-back{position:absolute;inset:0;background:var(--env2);border-radius:6px;z-index:1;box-shadow:0 18px 40px -16px rgba(120,60,80,.45),0 0 0 1px rgba(255,255,255,.6)}
.env-inside{position:absolute;inset:0;z-index:1;border-radius:6px;clip-path:polygon(0 0,100% 0,100% 60%,0 60%)}
.env-letter{position:absolute;left:6%;right:6%;top:7%;height:86%;z-index:2;background:var(--paper);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15);transition:transform .9s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;align-items:center;padding-top:8%;text-align:center;overflow:hidden}
.env-letter::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:3px}
.env-letter small{font-family:var(--f-caps);letter-spacing:.24em;text-transform:uppercase;font-size:2.6cqw;color:var(--label)}
.env-letter span{font-family:var(--f-script);color:var(--title);font-size:10cqw;line-height:1.1;margin-top:.1em}
.env-front{position:absolute;inset:0;z-index:3;border-radius:6px;
  background:linear-gradient(115deg,transparent 49.6%,rgba(120,60,80,.1) 50%,transparent 53%) 0 0/50% 100% no-repeat,linear-gradient(-115deg,transparent 49.6%,rgba(120,60,80,.1) 50%,transparent 53%) 100% 0/50% 100% no-repeat,linear-gradient(var(--env),var(--env2));
  clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;inset:0;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.45,.05,.25,1),z-index 0s .4s}
.env-flap>i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 60%);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px}
.flap-out{background:linear-gradient(var(--env-flap),var(--env))}
.flap-out::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(120,60,80,.1))}
.flap-in{transform:rotateX(180deg)}
.env-address{position:absolute;left:0;right:0;top:74%;z-index:4;text-align:center;color:var(--env-ink);padding:0 10%;transition:opacity .4s}
.env-address small{display:block;font-family:var(--f-caps);letter-spacing:.24em;text-transform:uppercase;font-size:2.5cqw;color:var(--env-label)}
.env-address span{display:block;font-family:var(--f-script);font-size:8.6cqw;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.05em 0}
.env-address span.long{font-size:6.4cqw}
.env-flowers{position:absolute;left:2%;top:30%;width:48%;z-index:5;pointer-events:none;transition:opacity .4s,transform .6s}
.seal{position:absolute;left:50%;top:52%;width:40%;aspect-ratio:1.35;z-index:6;transform:translate(-50%,-50%)}
.seal-half{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,.6,.3,1),opacity .5s .12s}
.seal-half.l{clip-path:polygon(-20% -20%,51% -20%,51% 120%,-20% 120%)}
.seal-half.r{clip-path:polygon(49% -20%,120% -20%,120% 120%,49% 120%)}
.seal svg{width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(90,40,50,.3))}
.env.open{animation:none}
.env.open .seal-half.l{transform:translate(-55%,15%) rotate(-28deg);opacity:0}
.env.open .seal-half.r{transform:translate(55%,15%) rotate(28deg);opacity:0}
.env.open .env-flowers{opacity:0;transform:translateY(10%)}
.env.open .env-flap{transform:rotateX(180deg);z-index:1;transition-delay:.3s,.7s}
.env.open .env-letter{transform:translateY(-58%);transition-delay:1s}
.env.open .env-address{opacity:0}
.env.away{transform:translateY(26vh) scale(.9)}
.tap-hint{font-family:var(--f-caps);letter-spacing:.3em;text-transform:uppercase;font-size:.78rem;color:var(--hint);margin:0;animation:pulse 2.2s ease-in-out infinite;position:relative;z-index:2}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
#envelope-screen.opening .tap-hint,#envelope-screen.opening .env-top{opacity:0;animation:none;transition:opacity .4s}

/* ───────────────────────── PAGE ───────────────────────── */
#page{position:relative;opacity:0;transform:translateY(30px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
#page.in{opacity:1;transform:none}
#page[hidden]{display:none}
.sheet{position:relative;max-width:640px;margin:0 auto;background:var(--paper);box-shadow:0 0 70px rgba(120,60,80,.25);overflow:hidden}
section{position:relative;padding:54px 26px;text-align:center}
section.alt{background:var(--paper2)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
html.in-editor .rv{opacity:1;transform:none;transition:none}
.k{font-family:var(--f-caps);text-transform:uppercase;letter-spacing:.28em;font-size:.72rem;color:var(--label);margin:0}
h2.sec{font-family:var(--f-script);font-weight:400;font-size:3.1rem;line-height:1.1;margin:.12em 0 .4em;color:var(--title)}
.div{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--accent);margin:6px auto 22px;max-width:240px}
.div::before,.div::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.div::after{transform:scaleX(-1)}
.div svg{width:20px;height:18px}
.lead{max-width:24em;margin:0 auto;color:var(--ink-soft);font-style:italic}

/* nav */
#nav{position:fixed;left:50%;top:10px;transform:translate(-50%,-90px);z-index:40;display:flex;gap:2px;padding:5px;border-radius:40px;background:color-mix(in srgb,var(--paper) 92%,transparent);box-shadow:0 8px 24px -10px rgba(90,40,60,.35);border:1px solid var(--line);transition:transform .5s cubic-bezier(.2,.7,.2,1);max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#nav::-webkit-scrollbar{display:none}
#nav.show{transform:translate(-50%,0)}
#nav a{flex:none;text-decoration:none;font-family:var(--f-caps);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;padding:9px 14px;border-radius:30px;color:var(--ink-soft);transition:background .3s,color .3s}
#nav a.on{background:var(--accent);color:var(--accent-ink)}

/* hero */
#hero{padding:0 0 46px;background:var(--paper)}
.bunting{position:relative;height:74px;z-index:3}
.bunting svg{width:100%;height:74px}
.hero-top{position:relative;padding:12px 22px 0}
.arch{position:relative;width:min(80%,340px);margin:0 auto;aspect-ratio:4/5;border-radius:999px 999px 18px 18px;overflow:hidden;border:2px solid var(--paper);box-shadow:0 0 0 6px var(--paper2),0 0 0 7px var(--line),0 22px 40px -22px rgba(90,40,60,.45);background:var(--paper2)}
.arch img,.arch>svg{width:100%;height:100%;object-fit:cover;display:block}
.hero-fl{position:absolute;pointer-events:none;z-index:3}
.hero-fl.fl-l{left:0;bottom:-30px;width:52%;max-width:250px;transform:rotate(8deg)}
.hero-fl.fl-r{right:0;bottom:-34px;width:52%;max-width:250px;transform:scaleX(-1) rotate(8deg)}
.hero-text{margin-top:46px;padding:0 18px}
.baby-line{font-family:var(--f-caps);letter-spacing:.26em;text-transform:uppercase;font-size:.78rem;color:var(--label);margin:0}
.title{font-family:var(--f-script);font-weight:400;color:var(--title);font-size:clamp(3.6rem,17vw,5rem);line-height:1;margin:.12em 0 0}
.honor{font-style:italic;color:var(--ink-soft);margin:.6em 0 0}
.mom{font-family:var(--f-caps);font-weight:500;font-size:1.5rem;letter-spacing:.12em;margin:.15em 0 0;color:var(--ink)}
.mom2{font-style:italic;color:var(--ink-soft);margin:.1em 0 0}
.dear{font-family:var(--f-script);font-size:2rem;color:var(--ink);margin:0 0 .3em;line-height:1.2}
.date-row{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px auto 0;font-family:var(--f-caps);color:var(--title)}
.date-row span{font-size:.82rem;letter-spacing:.22em;text-transform:uppercase;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-width:84px}
.date-row b{font-weight:400;font-size:2.6rem;line-height:1;font-family:var(--f-head)}
.date-row small{display:block;font-size:.7rem;letter-spacing:.3em;margin-top:2px}
.hosts{margin:18px 0 0;color:var(--ink-soft);font-style:italic}
.bear-btn{all:unset;cursor:pointer;display:block;width:92px;margin:22px auto 0;-webkit-tap-highlight-color:transparent;transition:transform .3s}
.bear-btn:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:50%}
.bear-btn:active{transform:scale(.93)}
.bear-btn.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.15) rotate(-6deg)}}

/* countdown */
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:6px auto 0}
.count div{padding:14px 2px 10px;border:1px solid var(--line);background:var(--field);border-radius:14px}
.count b{display:block;font-family:var(--f-head);font-weight:600;font-size:2.3rem;line-height:1;color:var(--title);font-variant-numeric:tabular-nums}
.count span{display:block;font-family:var(--f-caps);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;margin-top:7px;color:var(--ink-soft)}
.count-msg{font-family:var(--f-script);font-size:2.4rem;color:var(--title);line-height:1.2;margin:.2em 0}

/* cards */
.cards{display:grid;gap:16px;max-width:460px;margin:0 auto}
.card{border:1px solid var(--line);background:var(--field);padding:24px 20px 22px;border-radius:18px;position:relative}
.card .ico{width:54px;height:54px;margin:0 auto 6px;color:var(--accent)}
.card h3{font-family:var(--f-caps);font-weight:500;font-size:.95rem;letter-spacing:.22em;text-transform:uppercase;color:var(--title);margin:0}
.card .t{font-family:var(--f-head);font-size:1.4rem;font-weight:600;margin:.35em 0 0;line-height:1.25}
.card .w{font-style:italic;color:var(--ink-soft);margin:.25em 0 0;line-height:1.35}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:40px;padding:.85em 1.3em;font-family:var(--f-caps);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;display:inline-flex;gap:.6em;align-items:center;justify-content:center;min-height:48px;transition:transform .2s;line-height:1.2;text-align:center}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--paper);color:var(--accent2)}
.btn svg{width:16px;height:16px;flex:none}
.card .btn{margin-top:16px}
.map{margin:16px auto 0;max-width:460px;border:1px solid var(--line);border-radius:18px;overflow:hidden;height:230px;background:var(--paper2);position:relative}
.map::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(35deg,transparent 0 22px,rgba(0,0,0,.035) 22px 23px),repeating-linear-gradient(-55deg,transparent 0 30px,rgba(0,0,0,.035) 30px 31px)}
.map::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-26px 0 0 -13px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);box-shadow:0 4px 8px rgba(0,0,0,.2)}
.map iframe{position:relative;z-index:1;width:100%;height:100%;border:0;display:block}
.cal{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:460px;margin:16px auto 0}
.cal .btn{font-size:.62rem;letter-spacing:.12em;padding:.8em .6em}

/* schedule */
.tl{list-style:none;margin:0 auto;padding:0;max-width:400px;position:relative;text-align:left}
.tl::before{content:"";position:absolute;left:96px;top:12px;bottom:12px;width:0;border-left:2px dotted var(--line)}
.tl li{display:grid;grid-template-columns:84px 25px 1fr;align-items:start;padding:10px 0}
.tl time{font-family:var(--f-head);font-weight:600;color:var(--title);text-align:right;font-size:1.1rem;white-space:nowrap}
.tl li>i{width:13px;height:13px;border-radius:50%;background:var(--paper);border:2px solid var(--accent);margin:.4em auto 0;position:relative;z-index:1}
.tl strong{font-family:var(--f-caps);font-weight:500;font-size:.88rem;letter-spacing:.12em;text-transform:uppercase;display:block;line-height:1.4}
.tl span{color:var(--ink-soft);display:block;font-style:italic;line-height:1.3;font-size:.98rem}

/* registry etc */
.reg{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:18px auto 0}
.duo{display:grid;gap:16px;max-width:460px;margin:0 auto}
.duo .card{padding-top:28px}

/* faq */
.faq{max-width:460px;margin:0 auto;text-align:left;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:16px 34px 16px 4px;font-weight:600;font-size:1.15rem;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:1.5rem;color:var(--accent);transition:transform .3s}
.faq details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq details p{margin:0 4px 16px;color:var(--ink-soft);line-height:1.45}

/* rsvp */
.rsvp{max-width:440px;margin:0 auto;text-align:left}
.rsvp-note{text-align:center;color:var(--ink-soft);font-style:italic;margin:-.4em 0 1.2em}
.fld{margin:0 0 15px;border:0;padding:0;min-width:0}
.fld>label,.fld>legend{display:block;font-family:var(--f-caps);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--label);margin-bottom:6px;padding:0}
.fld input[type=text],.fld textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:.62em .85em;font-size:1.08rem;line-height:1.35}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--focus);outline-offset:1px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{position:relative;display:block}
.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.choice span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:66px;padding:.5em;text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--field);font-weight:600;font-size:1.08rem;line-height:1.2;transition:background .2s,color .2s}
.choice em{font-style:normal;font-size:1.2rem}
.choice input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.choice input:focus-visible+span{outline:3px solid var(--focus);outline-offset:3px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:40px;background:var(--field)}
.stepper button{all:unset;cursor:pointer;width:48px;height:46px;display:grid;place-items:center;font-size:1.4rem;color:var(--title)}
.stepper button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;border-radius:40px}
.stepper output{min-width:2.2em;text-align:center;font-weight:600;font-size:1.3rem}
.rsvp .btn{width:100%;margin-top:6px}
.rsvp-err{color:var(--accent2);font-weight:600;text-align:center;min-height:1.4em;margin:.3em 0}
.rsvp-done{text-align:center;padding:6px 0}
.rsvp-done .ill{width:120px;margin:0 auto 4px}
.rsvp-done h3{font-family:var(--f-script);font-weight:400;font-size:2.5rem;color:var(--title);margin:.1em 0;line-height:1.15}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--ink-soft);font-size:.95em;margin-top:.6em;display:inline-block;padding:.3em}
.linkbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* footer */
#footer{padding-bottom:30px}
.closing{max-width:24em;margin:0 auto;font-style:italic;font-size:1.1em}
.sign{font-family:var(--f-script);font-size:2.6rem;color:var(--title);margin:.3em 0 0;line-height:1.2}
.foot-art{width:220px;margin:16px auto 0}

/* music */
#music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:70;width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--title);display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(90,40,60,.45);padding:0}
#music[hidden]{display:none}
#music svg{width:22px;height:22px}
#music .off{transition:opacity .2s}
#music[aria-pressed="true"] .off{opacity:0}
#music[aria-pressed="true"]{animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.07)}}

@media(min-width:700px){#page{padding:40px 0 60px}section{padding:66px 56px}h2.sec{font-size:3.5rem}.sheet{border-radius:24px}}
@media(max-width:350px){section{padding-left:18px;padding-right:18px}.tl li{grid-template-columns:72px 23px 1fr}.tl::before{left:83px}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
}

  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Baby Shower Invitation//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT","UID:"+stamp(s)+"-"+Math.random().toString(36).slice(2,10)+"@invitation",
   "DTSTAMP:"+n.getUTCFullYear()+p2(n.getUTCMonth()+1)+p2(n.getUTCDate())+"T"+p2(n.getUTCHours())+p2(n.getUTCMinutes())+p2(n.getUTCSeconds())+"Z","DTSTART:"+stamp(s),"DTEND:"+stamp(e),

/* ───────── hearts & stars ───────── */
const fx=$("#fx");
function fxCols(){const p=PAL[theme()];return [p.accent,p.balloons[0],p.balloons[2],p.bow[1],"#ffffff"]}
const SHAPES={heart:"M8 15S1 10 1 5.5A3.5 3.5 0 0 1 8 3.6 3.5 3.5 0 0 1 15 5.5C15 10 8 15 8 15z",star:"M8 1l2 4.6 5 .5-3.8 3.3 1.1 5L8 11.8 3.7 14.4l1.1-5L1 6.1l5-.5z"};
function burst(x,y,n){if(reduced)n=Math.min(n,8);const cols=fxCols();
  for(let i=0;i<n;i++){const el=document.createElement("i"),a=Math.random()*Math.PI*2,d=50+Math.random()*120,sh=i%3===0?"star":"heart";el.className="pt";el.style.cssText=`left:${x}px;top:${y}px`;
    el.innerHTML=`<svg viewBox="0 0 16 16" width="16" height="16"><path d="${SHAPES[sh]}" fill="${cols[i%cols.length]}" stroke="rgba(0,0,0,.08)"/></svg>`;fx.appendChild(el);
    if(!el.animate){setTimeout(()=>el.remove(),600);continue}
    el.animate([{transform:"translate(-50%,-50%) scale(.3)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d*.7-60}px)) scale(${.7+Math.random()*.8}) rotate(${Math.random()*120-60}deg)`,opacity:0}],
      {duration:1300+Math.random()*1000,easing:"cubic-bezier(.15,.7,.35,1)",fill:"forwards"}).onfinish=()=>el.remove()}}
const floaters=(()=>{const cv=$("#float"),cx=cv.getContext("2d");let W=0,H=0,P=[],raf=0,last=0;const hp=new Path2D(SHAPES.heart),sp=new Path2D(SHAPES.star);
  function size(){const dpr=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);const n=Math.min(16,Math.round(W*H/40000));while(P.length<n)P.push(mk(true));P.length=n}
  function mk(any){return{x:Math.random()*W,y:any?Math.random()*H:H+16,s:.6+Math.random()*.8,v:10+Math.random()*16,p:Math.random()*6.28,r:Math.random()*.6-.3,c:Math.floor(Math.random()*3),h:Math.random()<.6,a:.25+Math.random()*.35}}
  function frame(t){raf=requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;cx.clearRect(0,0,W,H);const cols=fxCols();
    for(let i=0;i<P.length;i++){const f=P[i];f.y-=f.v*dt;f.p+=dt*.8;f.x+=Math.sin(f.p)*12*dt;if(f.y<-16)P[i]=mk(false);
      cx.save();cx.translate(f.x,f.y);cx.rotate(f.r);cx.scale(f.s,f.s);cx.globalAlpha=f.a;cx.fillStyle=cols[f.c];cx.fill(f.h?hp:sp);cx.restore()}}
  function start(){if(reduced||raf)return;last=performance.now();raf=requestAnimationFrame(frame)}
  document.addEventListener("visibilitychange",()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else start()});return{size,start}})();

/* ───────── sound (synthesised, no audio files) ───────── */
let AC=null,musicOn=false,musicTimer=null,mp3=null,master=null;
function ac(){if(!AC){const K=window.AudioContext||window.webkitAudioContext;if(!K)return null;AC=new K()}if(AC.state==="suspended")AC.resume();return AC}
function paperSound(){const c=ac();if(!c)return;const len=c.sampleRate*.5,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(.35+.65*Math.random());
  [[0,.26,1800,.1],[.3,.42,2600,.08]].forEach(([at,dur,f,v])=>{const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+at;s.buffer=buf;bp.type="bandpass";bp.Q.value=.8;
    bp.frequency.setValueAtTime(f*.6,t);bp.frequency.exponentialRampToValueAtTime(f*1.7,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+dur*.3);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(bp);bp.connect(g);g.connect(c.destination);s.start(t);s.stop(t+dur+.05)})}
function bell(c,f,t,v,dur,dest){[[1,1],[2.01,.3],[3.02,.1]].forEach(([m,a])=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f*m;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v*a,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur/m);o.connect(g);g.connect(dest||c.destination);o.start(t);o.stop(t+dur/m+.05)})}
function chime(){const c=ac();if(!c)return;[1568,1976,2349,3136].forEach((f,i)=>bell(c,f,c.currentTime+i*.11,.05,1.6))}
const N={C4:60,D4:62,E4:64,F4:65,G4:67,A4:69,B4:71,C5:72,D5:74,E5:76};
const TUNES={
  twinkle:{bpm:96,n:"C4 1,C4 1,G4 1,G4 1,A4 1,A4 1,G4 2,F4 1,F4 1,E4 1,E4 1,D4 1,D4 1,C4 2,G4 1,G4 1,F4 1,F4 1,E4 1,E4 1,D4 2,G4 1,G4 1,F4 1,F4 1,E4 1,E4 1,D4 2,C4 1,C4 1,G4 1,G4 1,A4 1,A4 1,G4 2,F4 1,F4 1,E4 1,E4 1,D4 1,D4 1,C4 2,R 2"},
  brahms:{bpm:110,n:"E4 .5,E4 .5,G4 2,E4 .5,E4 .5,G4 2,E4 .5,G4 .5,C5 1,B4 1.5,A4 .5,A4 1,G4 1,D4 .5,E4 .5,F4 1,D4 1,D4 .5,E4 .5,F4 2,D4 .5,F4 .5,B4 .5,A4 .5,G4 1,B4 1,C5 2,C4 .5,C4 .5,C5 2,A4 .5,F4 .5,G4 2,E4 .5,C4 .5,F4 1,G4 1,A4 1,G4 2,C4 .5,C4 .5,C5 2,A4 .5,F4 .5,G4 2,E4 .5,C4 .5,F4 1,E4 1,D4 1,C4 3,R 1"}};
function startBox(){const c=ac();if(!c)return false;const tune=TUNES[(C.music||{}).track]||TUNES.twinkle,notes=tune.n.split(",").map(s=>{const[a,b]=s.trim().split(" ");return[a,parseFloat(b)]}),beat=60/tune.bpm;
  master=c.createGain();master.gain.value=.9;master.connect(c.destination);let i=0,t=c.currentTime+.15;
  musicTimer=setInterval(()=>{while(t<c.currentTime+.7){const[nm,b]=notes[i];if(nm!=="R"){const f=440*Math.pow(2,(N[nm]+12-69)/12);bell(c,f,t,.075,Math.max(1.2,b*beat*1.7),master)}t+=b*beat;i=(i+1)%notes.length}},200);return true}
function setMusic(v){const b=$("#music"),m=C.music||{};
  if(v){let ok=false;if(m.source==="mp3"&&m.mp3Url){if(!mp3){mp3=new Audio(m.mp3Url);mp3.loop=true;mp3.volume=.5}mp3.play().catch(()=>setMusic(false));ok=true}else ok=startBox();if(!ok)return}
  else{if(mp3)mp3.pause();clearInterval(musicTimer);if(master){try{master.gain.setTargetAtTime(0,AC.currentTime,.15)}catch(e){}master=null}}
  musicOn=v;b.setAttribute("aria-pressed",String(v));b.setAttribute("aria-label",v?"Pause background music":"Play background music")}

/* ───────── countdown ───────── */
function tick(){const body=$("#count-body");if(!body)return;const s=startDT(),now=new Date(),lab=$("#count-label");
  const same=now.getFullYear()===s.getFullYear()&&now.getMonth()===s.getMonth()&&now.getDate()===s.getDate(),end=new Date(s.getFullYear(),s.getMonth(),s.getDate()+1);
  const st=same?"today":now>=end?"after":"before";
  if(body.dataset.state!==st){body.dataset.state=st;lab.textContent=st==="before"?"Counting down to the shower":st==="today"?"Today's the day":"With love & thanks";
    body.innerHTML=st==="before"?`<div class="count" role="timer" aria-label="Countdown to the baby shower">${["Days","Hours","Minutes","Seconds"].map((l,i)=>`<div><b id="cd${i}">0</b><span>${l}</span></div>`).join("")}</div>`
     :`<p class="count-msg">${st==="today"?"The shower is today!":"Thank you for showering us with love"}</p>`}
  if(st==="before"){const d=Math.max(0,Math.floor((s-now)/1000)),v=[Math.floor(d/86400),Math.floor(d%86400/3600),Math.floor(d%3600/60),d%60];v.forEach((x,i)=>{const e=$("#cd"+i);if(e)e.textContent=i?p2(x):x})}}

/* ───────── nav ───────── */
const NAV=[["details","Details"],["schedule","Schedule"],["registry","Registry"],["faq","FAQ"],["rsvp","RSVP"]];
let navIO=null;
function buildNav(){const n=$("#nav");const items=on("nav")?NAV.filter(([id])=>document.getElementById(id)):[];n.innerHTML=items.map(([id,l])=>`<a href="#${id}" data-id="${id}">${l}</a>`).join("");n.hidden=!items.length;
  if(navIO)navIO.disconnect();if(!items.length||!("IntersectionObserver"in window))return;
  navIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$$("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.id===e.target.id))}),{rootMargin:"-45% 0px -50% 0px"});items.forEach(([id])=>navIO.observe(document.getElementById(id)))}
function navShow(){const h=$("#hero");$("#nav").classList.toggle("show",!$("#page").hidden&&h&&h.getBoundingClientRect().bottom<120)}

/* ───────── meta ───────── */
function meta(){const sh=C.share||{},t=sh.title||(title()+(C.mom?" for "+C.mom:"")),s=startDT();
  const d=sh.description||("You're invited to a "+title().toLowerCase()+(C.mom?" honoring "+C.mom:"")+(s?" on "+longDate():"")+". Tap to open your invitation.");
  document.title=t;const set=(sel,v)=>{const m=$(sel);if(m&&v)m.setAttribute("content",v)};
  set('meta[name="description"]',d);set('meta[property="og:title"]',t);set('meta[property="og:description"]',d);set('meta[name="twitter:title"]',t);set('meta[name="twitter:description"]',d);
  set('meta[name="theme-color"]',getComputedStyle(document.documentElement).getPropertyValue("--bg").trim())}

/* ───────── render ───────── */
let io=null;
function render(){const t=theme(),g=guest();uid=0;document.documentElement.dataset.theme=t;
  $("#env-bunting").innerHTML=bunting(t,500);$("#env-balloons").innerHTML=balloons(t);$("#env-balloons2").innerHTML=balloons(t);
  $("#env-top").innerHTML=`<small>${esc(babyLine())}</small><b>${esc(title())}</b>`;
  $("#env-dear").textContent=g?(C.greeting||"Dear"):"A special invitation";const nm=$("#env-name");nm.textContent=g||"You're Invited";nm.classList.toggle("long",(g||"").length>20);
  $("#env-letter-small").textContent="You're invited";$("#env-letter-title").textContent=title();$("#env-flowers").innerHTML=bouquet(t);
  const b=bow(t);$("#seal").innerHTML=`<div class="seal-half l">${b}</div><div class="seal-half r">${b}</div>`;
  $("#sheet").innerHTML=[hero(),countdown(),details(),schedule(),registry(),extras(),faq(),rsvp(),footer()].join("");
  $("#music").hidden=!(C.music&&C.music.enabled);meta();tick();observe();buildNav();navShow()}
function observe(){const els=$$(".rv");if(reduced||PREVIEW||!("IntersectionObserver"in window)){els.forEach(e=>e.classList.add("on"));return}
  if(io)io.disconnect();io=new IntersectionObserver(en=>en.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px",threshold:.05});els.forEach(e=>io.observe(e))}

/* ───────── envelope ───────── */
const scr=$("#envelope-screen"),page=$("#page");
function showCard(instant){page.hidden=false;document.body.classList.remove("locked");
  if(instant){scr.hidden=true;page.style.transition="none";page.classList.add("in");requestAnimationFrame(()=>page.style.transition="")}
  else{scr.classList.add("done");requestAnimationFrame(()=>requestAnimationFrame(()=>page.classList.add("in")));setTimeout(()=>scr.hidden=true,900)}
  observe();buildNav();navShow()}
let opening=false;
function openEnvelope(){if(opening)return;opening=true;const s=C.sounds||{};try{if(s.paper!==false)paperSound();if(s.chime!==false)setTimeout(chime,1100)}catch(e){}
  if(reduced){showCard(false);return}const env=$("#env"),sr=$("#seal").getBoundingClientRect();scr.classList.add("opening");env.classList.add("open");burst(sr.left+sr.width/2,sr.top+sr.height/2,18);
  setTimeout(()=>env.classList.add("away"),1950);setTimeout(()=>showCard(false),2100)}

/* ───────── events ───────── */
$("#env-btn").addEventListener("click",openEnvelope);
$("#music").addEventListener("click",()=>setMusic(!musicOn));
$("#sheet").addEventListener("click",e=>{const t=e.target.closest("button,a");if(!t)return;
  if(t.id==="bear"){const r=t.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,30);t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");try{if((C.sounds||{}).chime!==false)chime()}catch(x){}}
  else if(t.id==="btn-ics")downloadIcs();
  else if(t.id==="rsvp-link"){const l=(C.rsvp||{}).link;if(l)openUrl(l);rsvpDone("link","","")}
  else if(t.id==="rsvp-again"){$("#rsvp-done").hidden=true;$("#rsvp-form").hidden=false}
  else if(t.dataset.step){const o=$("#r-n"),v=Math.max(1,Math.min(+o.dataset.max,+o.textContent+ +t.dataset.step));o.textContent=v}});
$("#sheet").addEventListener("change",e=>{if(e.target.name==="attend"){$("#r-extra").hidden=e.target.value==="no";$("#r-err").textContent=""}});
$("#sheet").addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="rsvp-form")sendRsvp()});
addEventListener("scroll",navShow,{passive:true});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>floaters.size(),150)});
setInterval(tick,1000);
if(PREVIEW)addEventListener("message",e=>{const m=e.data||{};
  if(m.type==="invite:update"&&m.config){C=m.config;if(musicOn)setMusic(false);mp3=null;render()}
  if(m.type==="invite:scroll"){const el=document.getElementById(m.id);if(el&&!page.hidden)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-12,behavior:reduced?"auto":"smooth"})}});

/* ───────── go ───────── */
if(PREVIEW)document.documentElement.classList.add("in-editor");
render();floaters.size();floaters.start();
if(params.get("preview")==="card"||(PREVIEW&&PREVIEW.mode==="card"))showCard(true);
window.__invite={render,openEnvelope,icsText,config:()=>C};
})();
</script>
</body>
</html>
