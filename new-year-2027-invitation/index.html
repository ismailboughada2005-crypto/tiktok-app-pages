<style>
/* ───────────────────────── THEME: black & gold ───────────────────────── */
:root{
  --f-title:"Playfair Display",Georgia,serif;      /* elegant serif for titles */
  --f-caps:"Cinzel","Trajan Pro",Georgia,serif;     /* small capitals for labels */
  --f-body:"Jost","Helvetica Neue",Arial,sans-serif;/* clean sans-serif for details */
  --body-size:1.06rem; --label-space:.26em;
  --black:#0B0B0F; --gold:#D4AF37; --gold-l:#F5E6B8; --gold-d:#9c7c22; --white:#FFFFFF;
  --foil:linear-gradient(180deg,#FFF6D6 0%,#F5E6B8 22%,#D4AF37 55%,#B08A26 78%,#E9CF7A 100%);
  --bg:#0B0B0F; --bg-art:radial-gradient(120% 80% at 50% 0%,#221d10 0%,#0B0B0F 55%,#050507 100%);
  --paper:#111116; --paper-art:radial-gradient(90% 45% at 50% 0%,rgba(212,175,55,.12) 0%,transparent 70%),linear-gradient(#131318,#0d0d11);
  --ink:#FFFFFF; --ink-soft:#d9d0b8; --title:#D4AF37; --label:#D4AF37;
  --accent:#D4AF37; --accent-ink:#0B0B0F; --accent2:#F5E6B8; --line:rgba(212,175,55,.45);
  --field:#18181f; --panel:rgba(212,175,55,.06);
  --env:#1b1b22; --env2:#0B0B0F; --env-flap:#23232c;
  --liner-art:radial-gradient(circle at 50% 50%,rgba(245,230,184,.95) 0 1px,transparent 1.5px) 0 0/12px 12px,radial-gradient(circle at 50% 50%,rgba(212,175,55,.8) 0 1.4px,transparent 1.9px) 6px 6px/12px 12px,linear-gradient(135deg,#17140b,#0B0B0F);
  --seal1:#EBCB6B; --seal2:#9c7c22; --seal-ink:#3b2c07; --name:#F5E6B8; --env-label:#D4AF37;
  --hint:#F5E6B8; --radius:6px; --focus:#F5E6B8;
}

/* ───────────────────────── BASE ───────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:var(--body-size);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:var(--bg-art);z-index:-1}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
.foil{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.spark{position:absolute;width:14px;height:14px;will-change:transform,opacity;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.spark.dot{clip-path:none;border-radius:50%;width:6px;height:6px}
.spark.conf{clip-path:none;border-radius:1px;width:7px;height:12px}
.spark.fw{clip-path:none;border-radius:50%;width:5px;height:5px;box-shadow:0 0 8px 2px currentColor}

/* hanging stars garland (replaces the Christmas string lights) */
.lights{position:absolute;top:0;left:0;width:100%;height:84px;pointer-events:none;z-index:3;overflow:hidden}
.lights svg{width:100%;height:84px}
.lights .wire{fill:none;stroke:var(--gold);stroke-width:1.2;opacity:.6}
.lights .str{stroke:var(--gold);stroke-width:.8;opacity:.55}
.bulb{animation:twinkle 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.bulb:nth-child(4n+1){animation-delay:-.4s;animation-duration:3.1s}
.bulb:nth-child(4n+2){animation-delay:-1.3s}
.bulb:nth-child(4n+3){animation-delay:-2s;animation-duration:3.6s}
.bulb:nth-child(5n){animation-delay:-.9s;animation-duration:2.2s}
.bulb .glow{opacity:.22}
.c1{fill:#F5E6B8}.c2{fill:#D4AF37}.c3{fill:#fff4cf}.c4{fill:#E9CF7A}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}

/* ───────────────────────── ENVELOPE SCREEN ───────────────────────── */
#envelope-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(18px,4vh,36px);padding:90px 16px 40px;background:var(--bg-art),var(--bg);transition:opacity .7s ease,visibility 0s .7s}
#envelope-screen.done{opacity:0;visibility:hidden;pointer-events:none}
#envelope-screen[hidden]{display:none}
.env-from{font-family:var(--f-caps);letter-spacing:var(--label-space);text-transform:uppercase;font-size:.74rem;color:var(--hint);text-align:center;margin:0;opacity:.95}
.env-from b{display:block;font-weight:600;font-family:var(--f-title);font-style:italic;font-size:2rem;letter-spacing:0;text-transform:none;margin-top:.15em;line-height:1.15}
.env-btn{all:unset;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:10px;margin-top:clamp(40px,11vh,110px)}
.env-btn:focus-visible{outline:3px solid var(--focus);outline-offset:10px}
.env{position:relative;width:min(88vw,430px);aspect-ratio:1.42;perspective:1400px;container-type:inline-size;
  animation:float 5s ease-in-out infinite;transition:transform .8s cubic-bezier(.5,0,.3,1)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-8px) rotate(.6deg)}}
.env-shadow{position:absolute;left:6%;right:6%;bottom:-9%;height:10%;background:radial-gradient(closest-side,rgba(212,175,55,.18),transparent);z-index:0}
.env-back{position:absolute;inset:0;background:var(--env2);border-radius:7px;z-index:1;box-shadow:inset 0 0 0 1.5px var(--gold),0 20px 50px -20px rgba(0,0,0,.9)}
.env-inside{position:absolute;inset:0;z-index:1;border-radius:7px;background:var(--liner-art);clip-path:polygon(0 0,100% 0,100% 60%,0 60%);opacity:.96}
.env-letter{position:absolute;left:6%;right:6%;top:7%;height:86%;z-index:2;background:var(--paper-art),var(--paper);border-radius:4px;
  box-shadow:0 2px 10px rgba(0,0,0,.5);transition:transform .85s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;align-items:center;
  padding-top:8%;text-align:center;color:var(--ink);overflow:hidden}
.env-letter::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:2px}
.env-letter small{font-family:var(--f-caps);letter-spacing:var(--label-space);text-transform:uppercase;font-size:11px;font-size:2.7cqw;color:var(--label)}
.env-letter span{font-family:var(--f-title);font-style:italic;font-weight:600;font-size:28px;font-size:7.6cqw;line-height:1.1;margin-top:.2em;padding:0 8%}
.env-front{position:absolute;inset:0;z-index:3;border-radius:7px;
  background:linear-gradient(115deg,transparent 49.7%,rgba(212,175,55,.7) 50%,transparent 50.6%) 0 0/50% 100% no-repeat,
             linear-gradient(-115deg,transparent 49.7%,rgba(212,175,55,.7) 50%,transparent 50.6%) 100% 0/50% 100% no-repeat,
             linear-gradient(var(--env),var(--env2));
  clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;inset:0;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.45,.05,.25,1),z-index 0s .38s}
.env-flap>i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 60%);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7px}
.flap-out{background:linear-gradient(var(--env-flap),var(--env))}
.flap-out::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.35))}
.flap-out svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.flap-in{background:var(--liner-art);transform:rotateX(180deg)}
.env-address{position:absolute;left:0;right:0;top:74%;z-index:4;text-align:center;color:var(--name);padding:0 9%;transition:opacity .4s}
.env-address small{display:block;font-family:var(--f-caps);letter-spacing:var(--label-space);text-transform:uppercase;font-size:10px;font-size:2.6cqw;color:var(--env-label)}
.env-address span{display:block;font-family:var(--f-title);font-style:italic;font-weight:500;font-size:26px;font-size:7.6cqw;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.1em 0}
.env-address span.long{font-size:5.8cqw}
/* gold wax seal with the year */
.seal{position:absolute;left:50%;top:57%;width:21%;aspect-ratio:1;z-index:6;transform:translate(-50%,-50%)}
.seal-half{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,.6,.3,1),opacity .5s .12s}
.seal-half.l{clip-path:polygon(-20% -20%,52% -20%,44% 22%,56% 40%,45% 60%,55% 80%,49% 120%,-20% 120%)}
.seal-half.r{clip-path:polygon(52% -20%,120% -20%,120% 120%,49% 120%,55% 80%,45% 60%,56% 40%,44% 22%)}
.wax{position:absolute;inset:0;border-radius:47% 53% 50% 50%/52% 47% 53% 48%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.55),transparent 30%),radial-gradient(circle at 50% 50%,var(--seal1) 0 58%,var(--seal2) 100%);
  box-shadow:0 3px 9px rgba(0,0,0,.6),inset 0 -3px 6px rgba(0,0,0,.25)}
.wax::before{content:"";position:absolute;inset:13%;border-radius:50%;box-shadow:inset 0 2px 3px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.3);background:radial-gradient(circle,var(--seal1),var(--seal2) 130%)}
.wax b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-caps);font-weight:700;color:var(--seal-ink);
  font-size:4.1cqw;letter-spacing:.02em;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.wax b svg{width:3.2cqw;height:3.2cqw;margin-bottom:.15em}
.env.open .seal-half.l{transform:translate(-42%,26%) rotate(-24deg);opacity:0}
.env.open .seal-half.r{transform:translate(42%,26%) rotate(24deg);opacity:0}
.env.open{animation:none}
.env.open .env-flap{transform:rotateX(180deg);z-index:1;transition-delay:.3s,.68s}
.env.open .env-letter{transform:translateY(-58%);transition-delay:.95s}
.env.open .env-address{opacity:.0}
.env.away{transform:translateY(26vh) scale(.9)}
.tap-hint{font-family:var(--f-caps);letter-spacing:var(--label-space);text-transform:uppercase;font-size:.8rem;color:var(--hint);margin:0;
  animation:pulse 2s ease-in-out infinite;transition:opacity .3s}
@keyframes pulse{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
#envelope-screen.opening .tap-hint,#envelope-screen.opening .env-from{opacity:0;animation:none}

/* ───────── 3 · 2 · 1 countdown overlay (after the envelope opens) ───────── */
#nye-count{position:fixed;inset:0;z-index:75;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(11,11,15,.55),rgba(11,11,15,.92));
  opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s;pointer-events:none}
#nye-count.on{opacity:1;visibility:visible;transition:opacity .35s ease}
#nye-count span{display:block;font-family:var(--f-title);font-weight:700;line-height:1;font-size:min(46vmin,280px);text-align:center;
  background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(212,175,55,.35))}
#nye-count span.msg{font-size:min(13vmin,84px);font-style:italic;padding:0 16px}
#nye-count span.go{animation:tick .62s cubic-bezier(.2,.8,.3,1) both}
@keyframes tick{0%{transform:scale(.4);opacity:0}35%{transform:scale(1.06);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.25);opacity:0}}
#nye-count span.msg.go{animation:hny 1.1s cubic-bezier(.2,.8,.3,1) both}
@keyframes hny{0%{transform:scale(.7);opacity:0}30%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(1.04);opacity:0}}

/* ───────────────────────── CARD ───────────────────────── */
#page{position:relative;padding:84px 12px 56px;opacity:0;transform:translateY(34px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
#page.in{opacity:1;transform:none}
#page[hidden]{display:none}
.card{position:relative;z-index:2;max-width:600px;margin:0 auto;background:var(--paper-art),var(--paper);border-radius:var(--radius);border:1px solid var(--line);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.8),0 0 60px -20px rgba(212,175,55,.25);padding:34px 24px 34px;text-align:center}
.card::before{content:"";position:absolute;inset:9px;border:1px solid var(--line);border-radius:calc(var(--radius) - 3px);pointer-events:none}
.card::after{content:"";position:absolute;inset:13px;border:1px solid var(--line);opacity:.45;border-radius:calc(var(--radius) - 5px);pointer-events:none}
.corner{position:absolute;width:74px;height:74px;color:var(--gold);pointer-events:none;z-index:1}
.corner.tl{top:4px;left:4px}.corner.tr{top:4px;right:4px;transform:scaleX(-1)}
.corner.bl{bottom:4px;left:4px;transform:scaleY(-1)}.corner.br{bottom:4px;right:4px;transform:scale(-1)}
section{position:relative;padding:8px 0}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
html.in-editor .rv{opacity:1;transform:none;transition:none}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:24px auto;color:var(--gold);max-width:340px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.divider::after{transform:scaleX(-1)}
.divider svg{width:64px;height:28px;flex:none}
.label{font-family:var(--f-caps);text-transform:uppercase;letter-spacing:var(--label-space);font-size:.72rem;font-weight:500;color:var(--label);margin:0}
h2.sec{font-family:var(--f-title);font-style:italic;font-weight:600;font-size:2.3rem;line-height:1.15;margin:.15em 0 .55em;color:var(--gold-l)}
p{margin:.4em 0}

/* hero */
.ornament{all:unset;cursor:pointer;display:block;width:64px;margin:-34px auto 8px;position:relative;transform-origin:50% 0;animation:swing 4.5s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.ornament:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:12px}
.ornament svg{width:64px;height:104px;overflow:visible}
.ornament.pop svg{animation:pop .5s ease}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes pop{40%{transform:scale(1.22)}}
.dear{font-family:var(--f-title);font-style:italic;font-size:1.6rem;color:var(--gold-l);margin:0 0 .3em;line-height:1.2}
h1.title{font-family:var(--f-title);font-style:italic;font-weight:600;margin:.1em 0 .05em;line-height:1.05;font-size:clamp(2.5rem,11.5vw,3.6rem);text-wrap:balance;
  background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
h1.title .yr{display:block;font-family:var(--f-caps);font-style:normal;font-weight:700;font-size:1.9em;letter-spacing:.04em;line-height:1;margin-top:.04em;filter:drop-shadow(0 4px 18px rgba(212,175,55,.3))}
h1.title.long{font-size:clamp(2.1rem,9.5vw,3rem)}
.intro{max-width:24em;margin:.6em auto 0;font-size:1.12rem;color:var(--white);font-weight:300;letter-spacing:.01em}
.hosts{font-family:var(--f-title);font-size:1.45rem;font-weight:500;margin:.1em 0 0;line-height:1.2;color:var(--white)}
.hosts-sub{font-style:italic;color:var(--ink-soft);margin:.1em 0 0}
.date-line{display:inline-flex;gap:.7em;align-items:center;margin-top:1.1em;padding:.5em 1.1em;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-family:var(--f-caps);letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;font-weight:500;color:var(--gold-l)}
.date-line i{width:4px;height:4px;border-radius:50%;background:var(--gold);flex:none}
.frame{position:relative;width:min(74%,300px);margin:26px auto 8px}
.frame-in{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:999px 999px 8px 8px;border:1px solid var(--gold);
  box-shadow:0 0 0 7px var(--paper),0 0 0 8px var(--line),0 0 40px rgba(212,175,55,.2);background:#0d0d14}
.frame-in img,.frame-in svg{width:100%;height:100%;object-fit:cover;display:block}
.frame .sprig{position:absolute;width:46px;height:46px;left:50%;bottom:-23px;transform:translateX(-50%);z-index:2;color:var(--gold)}

/* countdown */
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:10px auto 0}
.count div{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 2px 9px}
.count b{display:block;font-family:var(--f-title);font-size:2.1rem;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
.count span{display:block;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;margin-top:6px;color:var(--ink-soft);font-family:var(--f-caps)}
.count-msg{font-family:var(--f-title);font-style:italic;font-size:2rem;color:var(--gold-l);line-height:1.2;margin:.2em 0}

/* details */
.details{display:grid;gap:12px;text-align:left;max-width:440px;margin:0 auto}
.detail{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.ico{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:none;border:1px solid var(--gold);color:var(--gold)}
.ico svg{width:21px;height:21px}
.detail .label{font-size:.66rem}
.detail strong{display:block;font-family:var(--f-title);font-size:1.25rem;font-weight:600;line-height:1.25;color:var(--white)}
.detail p{margin:.1em 0 0;color:var(--ink-soft);line-height:1.35}
.dots{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.dots i{width:24px;height:24px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line),0 2px 4px rgba(0,0,0,.4)}
.badge{display:inline-flex;align-items:center;gap:.4em;margin-top:9px;padding:.32em .9em;background:var(--accent);color:var(--accent-ink);border-radius:30px;
  font-family:var(--f-caps);font-weight:600;font-size:.74rem;letter-spacing:.1em;transform:rotate(-2deg);box-shadow:0 3px 12px rgba(212,175,55,.3)}

/* timeline */
.timeline{list-style:none;margin:0 auto;padding:0;max-width:400px;text-align:left;position:relative}
.timeline::before{content:"";position:absolute;left:99px;top:10px;bottom:10px;width:1px;background:var(--line)}
.timeline li{display:grid;grid-template-columns:86px 27px 1fr;align-items:start;padding:8px 0}
.timeline time{font-family:var(--f-caps);font-weight:500;color:var(--gold);text-align:right;font-size:.86rem;letter-spacing:.04em;white-space:nowrap;padding-top:.15em}
.timeline li>i{width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--gold);margin:.42em auto 0;position:relative;z-index:1}
.timeline li:first-child>i,.timeline li.mid>i{background:var(--gold);box-shadow:0 0 10px rgba(212,175,55,.8)}
.timeline strong{font-family:var(--f-title);font-weight:600;font-size:1.12rem;display:block;line-height:1.3;color:var(--white)}
.timeline span{color:var(--ink-soft);display:block;line-height:1.3;font-size:.94em}

/* menu */
.menu{max-width:420px;margin:0 auto}
.menu h3{font-family:var(--f-caps);font-size:.72rem;letter-spacing:var(--label-space);text-transform:uppercase;color:var(--gold);margin:1.1em 0 .25em;font-weight:500}
.menu p{font-family:var(--f-title);font-style:italic;font-size:1.08em;margin:.1em 0;line-height:1.4;color:var(--white)}

/* midnight toast (replaces the Christmas gift exchange) */
.gift{max-width:440px;margin:0 auto;padding:22px 18px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);position:relative}
.gift-ico{width:58px;height:58px;margin:-50px auto 6px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold)}
.gift-ico svg{width:32px;height:32px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 12px}
.chip{padding:.3em .9em;border:1px solid var(--line);border-radius:30px;background:var(--paper);font-size:.92em;line-height:1.3;color:var(--ink-soft)}
.chip b{font-family:var(--f-caps);font-weight:600;color:var(--gold-l);letter-spacing:.04em}
.rules{list-style:none;margin:0;padding:0;text-align:left}
.rules li{position:relative;padding:.25em 0 .25em 1.5em;line-height:1.4}
.rules li::before{content:"✦";position:absolute;left:.15em;color:var(--gold);font-size:.8em;top:.5em}

/* buttons */
.btns{display:grid;gap:10px;max-width:440px;margin:0 auto}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:40px;padding:.9em 1.3em;
  font-family:var(--f-caps);font-weight:600;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;display:inline-flex;gap:.6em;align-items:center;justify-content:center;
  min-height:50px;transition:transform .2s ease,box-shadow .2s ease,background .2s;box-shadow:0 8px 24px -10px rgba(212,175,55,.55);text-align:center;line-height:1.2}
.btn.gold{background:var(--foil);border-color:#E9CF7A}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--gold-l);border-color:var(--line);box-shadow:none}
.btn svg{width:18px;height:18px;flex:none}
.cal-menu{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.cal-menu[hidden]{display:none}
.cal-menu .btn{font-size:.7rem;padding:.6em .5em;min-height:46px;letter-spacing:.12em}
@media(min-width:560px){.btns{grid-template-columns:1fr 1fr}.cal-menu{grid-column:1/-1}}

/* rsvp */
.rsvp{max-width:440px;margin:0 auto;text-align:left}
.rsvp-note{text-align:center;color:var(--ink-soft);margin:-.3em 0 1em}
.rsvp-how{text-align:center;color:var(--ink-soft);font-size:.86rem;margin:.6em 0 0}
.fld{margin:0 0 14px;border:0;padding:0;min-width:0}
.fld>label,.fld>legend{display:block;font-family:var(--f-caps);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;font-weight:500;color:var(--label);margin-bottom:6px;padding:0}
.fld input[type=text],.fld textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:var(--radius);padding:.65em .85em;font-size:1rem;line-height:1.35;color:var(--white)}
.fld input::placeholder,.fld textarea::placeholder{color:rgba(217,208,184,.55)}
.fld textarea{min-height:74px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--accent)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{position:relative;display:block}
.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.choice span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:72px;padding:.5em;text-align:center;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--field);font-family:var(--f-body);font-weight:500;font-size:.98rem;line-height:1.2;transition:background .2s,color .2s,transform .2s}
.choice em{font-style:normal;font-size:1.3rem;line-height:1}
.choice input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);transform:scale(1.02)}
.choice input:focus-visible+span{outline:3px solid var(--focus);outline-offset:3px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:40px;background:var(--field);overflow:hidden}
.stepper button{all:unset;cursor:pointer;width:48px;height:46px;display:grid;place-items:center;font-size:1.5rem;font-family:Georgia,serif;color:var(--gold)}
.stepper button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;border-radius:40px}
.stepper output{min-width:2.2em;text-align:center;font-family:var(--f-title);font-weight:600;font-size:1.3rem}
.rsvp .btn{width:100%;margin-top:4px}
.rsvp-err{color:#ffb4a8;font-weight:500;text-align:center;min-height:1.4em;margin:.3em 0}
.rsvp-done{text-align:center;padding:10px 0}
.rsvp-done svg{width:86px;height:86px;margin:0 auto 6px;color:var(--gold)}
.rsvp-done circle{stroke-dasharray:240;stroke-dashoffset:240;animation:draw .8s ease forwards}
.rsvp-done path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rsvp-done h3{font-family:var(--f-title);font-style:italic;font-weight:600;font-size:2.1rem;color:var(--gold-l);margin:.1em 0;line-height:1.15}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--ink-soft);font-size:.95em;margin-top:.6em;display:inline-block;padding:.3em}
.linkbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}

/* footer */
.closing{max-width:25em;margin:0 auto;font-family:var(--f-title);font-style:italic;font-size:1.12em;color:var(--white)}
.sign{font-family:var(--f-title);font-style:italic;font-weight:600;font-size:1.9rem;margin:.4em 0 0;line-height:1.2;background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
.foot-art{width:150px;height:60px;margin:14px auto 0;color:var(--gold)}

/* music */
#music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:70;width:50px;height:50px;border-radius:50%;border:1px solid var(--line);
  background:var(--black);color:var(--gold);display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.8),0 0 0 1px rgba(212,175,55,.2);padding:0;transition:transform .2s}
#music[hidden]{display:none}
#music:hover{transform:scale(1.06)}
#music svg{width:22px;height:22px}
#music .off-line{opacity:1;transition:opacity .2s}
#music[aria-pressed="true"] .off-line{opacity:0}
#music[aria-pressed="true"]{animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}

@media(min-width:700px){
  #page{padding:104px 24px 90px}
  .card{padding:50px 56px 50px}
  .card::before{inset:12px}.card::after{inset:17px}
  h2.sec{font-size:2.7rem}
  .divider{margin:32px auto}
  .lights,.lights svg{height:96px}
}
@media(max-width:350px){.card{padding-left:18px;padding-right:18px}.timeline li{grid-template-columns:74px 25px 1fr}.timeline::before{left:86px}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}

/* ───────── links ───────── */
function mapsUrl(){return C.mapsLink||("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([C.venue,C.address].filter(Boolean).join(", ")))}
function calText(){return{title:title()+(C.hosts?" · "+C.hosts:""),where:[C.venue,C.address].filter(Boolean).join(", "),
  desc:[(C.dressCode&&C.dressCode.text&&on("dressCode"))?"Dress code: "+C.dressCode.text:"",location.protocol.startsWith("http")?"Invitation: "+location.origin+location.pathname:""].filter(Boolean).join("\n")}}
function gcalUrl(){const s=startDT(),e=endDT(),t=calText();if(!s)return"#";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t.title)+"&dates="+stamp(s)+"/"+stamp(e)+"&location="+encodeURIComponent(t.where)+"&details="+encodeURIComponent(t.desc)}
function icsText(){const s=startDT(),e=endDT(),t=calText(),x=v=>String(v).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1"),n=new Date();
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//New Year Invitation//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT",
    "UID:"+stamp(s)+"-"+Math.random().toString(36).slice(2,10)+"@invitation",
    "DTSTAMP:"+n.getUTCFullYear()+p2(n.getUTCMonth()+1)+p2(n.getUTCDate())+"T"+p2(n.getUTCHours())+p2(n.getUTCMinutes())+p2(n.getUTCSeconds())+"Z",
    "DTSTART:"+stamp(s),"DTEND:"+stamp(e),"SUMMARY:"+x(t.title),"LOCATION:"+x(t.where),"DESCRIPTION:"+x(t.desc),
    "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:"+x(t.title)+" is tomorrow","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n")}
function downloadIcs(){const b=new Blob([icsText()],{type:"text/calendar;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=title().replace(/[^\w]+/g,"-").replace(/^-|-$/g,"").toLowerCase()+".ics";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function openUrl(u){window.__inviteLastUrl=u;if(PREVIEW)return;
  if(/^(mailto|sms|tel):/.test(u)){location.href=u;return}
  const w=window.open(u,"_blank","noopener");if(!w)location.href=u}

/* ───────── RSVP ───────── */
function sendRsvp(){
  const r=C.rsvp||{},name=$("#r-name").value.trim(),att=($("input[name=attend]:checked")||{}).value,err=$("#r-err");
  if(!name){err.textContent="Please add your name so we know who's replying.";$("#r-name").focus();return}
  if(!att){err.textContent="Please choose if you can join us.";$("input[name=attend]").focus();return}
  err.textContent="";
  const yes=att==="yes",n=$("#r-n").textContent,diet=$("#r-diet").value.trim(),msg=$("#r-msg").value.trim(),s=startDT();
  const lines=["🥂 RSVP: "+title()+(s?" ("+fmt(s,{month:"short",day:"numeric"})+")":""),"","Name: "+name,"Attending: "+(yes?"Yes, count me in! 🎉":"Sorry, can't make it")];
  if(yes){lines.push("Guests: "+n);if(diet)lines.push("Dietary notes: "+diet)}
  if(msg)lines.push("Message: "+msg);
  const text=lines.join("\n");
  if(r.method==="email")openUrl("mailto:"+encodeURIComponent(r.email||"").replace(/%40/g,"@")+"?subject="+encodeURIComponent("RSVP: "+title()+" · "+name)+"&body="+encodeURIComponent(text));
  else openUrl("https://wa.me/"+String(r.whatsapp||"").replace(/\D/g,"")+"?text="+encodeURIComponent(text));
  rsvpDone(yes?"yes":"no",name.split(" ")[0],r.method==="email"?"Your email app should now be open. Just press send.":"WhatsApp should now be open. Just press send.");
}
function rsvpDone(kind,name,how){
  const f=$("#rsvp-form"),d=$("#rsvp-done");if(!d)return;
  const head=kind==="yes"?"Cheers"+(name?", "+name:"")+"!":kind==="no"?"We'll miss you"+(name?", "+name:"")+"!":"Thank you!";
  const sub=kind==="yes"?"We can't wait to ring in "+newYear()+" with you.":kind==="no"?"Thank you for letting us know. Happy New Year!":"Your RSVP form has opened in a new tab.";
  d.innerHTML=`<svg viewBox="0 0 86 86" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="43" cy="43" r="38"/><path d="M27 44l11 11 21-23"/></svg><h3>${esc(head)}</h3><p>${esc(sub)}</p>${how?`<p style="color:var(--ink-soft);font-size:.92em">${esc(how)}</p>`:""}<button class="linkbtn" id="rsvp-again" type="button">Change my reply</button>`;
  f.hidden=true;d.hidden=false;
  const b=d.getBoundingClientRect();
  if(kind!=="no")confetti(b.left+b.width/2,b.top+50);else burst(b.left+b.width/2,b.top+50,12);
}

/* ───────── sparkles, confetti & fireworks ───────── */
const fx=$("#fx");
const GOLDS=["#D4AF37","#F5E6B8","#FFF6D6","#E9CF7A","#FFFFFF"];
function burst(x,y,n){
  if(reduced)n=Math.min(n||0,6);const cols=GOLDS;
  for(let i=0;i<(n||22);i++){const el=document.createElement("i"),a=Math.random()*Math.PI*2,d=40+Math.random()*95,sz=.5+Math.random()*1.1;
    el.className="spark"+(i%4===0?" dot":"");el.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%cols.length]}`;fx.appendChild(el);
    if(!el.animate){setTimeout(()=>el.remove(),600);continue}
    el.animate([{transform:"translate(-50%,-50%) scale(.2)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d+18}px)) scale(${sz}) rotate(${Math.random()*180}deg)`,opacity:0}],
      {duration:700+Math.random()*700,easing:"cubic-bezier(.15,.7,.3,1)",fill:"forwards"}).onfinish=()=>el.remove()}
}
function confetti(x,y){
  burst(x,y,16);if(reduced)return;const cols=GOLDS;
  for(let i=0;i<34;i++){const el=document.createElement("i"),dx=(Math.random()-.5)*300,up=80+Math.random()*130,r=Math.random()*720-360;
    el.className="spark conf";el.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%cols.length]}`;fx.appendChild(el);
    if(!el.animate){el.remove();continue}
    el.animate([{transform:"translate(-50%,-50%)",opacity:1},{transform:`translate(calc(-50% + ${dx*.6}px),calc(-50% - ${up}px)) rotate(${r/2}deg)`,opacity:1,offset:.35,easing:"ease-in"},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${150+Math.random()*160}px)) rotate(${r}deg)`,opacity:0}],
      {duration:1500+Math.random()*900,easing:"cubic-bezier(.2,.8,.4,1)",fill:"forwards"}).onfinish=()=>el.remove()}
}
// one firework: a glowing ring of gold sparks that falls with gravity
function firework(x,y,n){
  const cols=GOLDS;n=n||30;
  for(let i=0;i<n;i++){const el=document.createElement("i"),a=i/n*Math.PI*2+Math.random()*.2,d=70+Math.random()*80,c=cols[i%cols.length];
    el.className="spark fw";el.style.cssText=`left:${x}px;top:${y}px;background:${c};color:${c}`;fx.appendChild(el);
    if(!el.animate){el.remove();continue}
    const ex=Math.cos(a)*d,ey=Math.sin(a)*d;
    el.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:1},{transform:`translate(calc(-50% + ${ex}px),calc(-50% + ${ey}px)) scale(1)`,opacity:1,offset:.45,easing:"ease-in"},{transform:`translate(calc(-50% + ${ex*1.15}px),calc(-50% + ${ey*1.15+70}px)) scale(.5)`,opacity:0}],
      {duration:1300+Math.random()*500,easing:"cubic-bezier(.1,.8,.3,1)",fill:"forwards"}).onfinish=()=>el.remove()}
}
function fireworksShow(){
  const W=innerWidth,H=innerHeight,spots=[[.5,.36],[.24,.26],[.76,.28],[.32,.52],[.7,.5],[.5,.18]];
  spots.forEach(([fx_,fy],i)=>setTimeout(()=>{firework(W*fx_+(Math.random()-.5)*30,H*fy+(Math.random()-.5)*30,W<500?24:34);try{if((C.sounds||{}).chime!==false)pop()}catch(e){}},i*170));
  setTimeout(()=>confetti(W/2,H*.3),400);
}

/* ───────── sound (all synthesised, no audio files) ───────── */
let AC=null,musicOn=false,musicTimer=null,mp3=null,master=null;
function ac(){if(!AC){const K=window.AudioContext||window.webkitAudioContext;if(!K)return null;AC=new K()}if(AC.state==="suspended")AC.resume();return AC}
function paperSound(){const c=ac();if(!c)return;const len=c.sampleRate*.5,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(.35+.65*Math.random());
  [[0,.26,1800,.11],[.3,.42,2600,.09]].forEach(([at,dur,f,v])=>{const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+at;
    s.buffer=buf;bp.type="bandpass";bp.Q.value=.8;bp.frequency.setValueAtTime(f*.6,t);bp.frequency.exponentialRampToValueAtTime(f*1.7,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+dur*.3);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(bp);bp.connect(g);g.connect(c.destination);s.start(t);s.stop(t+dur+.05)})}
function bell(c,f,t,v,dur,dest){[[1,1],[2.01,.35],[3.02,.12]].forEach(([m,a])=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f*m;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v*a,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur/m);o.connect(g);g.connect(dest||c.destination);o.start(t);o.stop(t+dur/m+.05)})}
function chime(){const c=ac();if(!c)return;[1318.5,1568,2093,2637].forEach((f,i)=>bell(c,f,c.currentTime+i*.11,.07,1.6))}
function tickSound(hi){const c=ac();if(!c)return;bell(c,hi?1760:1046.5,c.currentTime,.09,.9)}
function pop(){const c=ac();if(!c)return;const len=c.sampleRate*.35,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=buf;f.type="lowpass";f.frequency.value=900+Math.random()*900;g.gain.value=.22;s.connect(f);f.connect(g);g.connect(c.destination);s.start()}
const N={C4:60,D4:62,E4:64,F4:65,"F#4":66,G4:67,A4:69,"Bb4":70,B4:71,C5:72,D5:74,E5:76,F5:77,G5:79};
const TUNES={
  // Auld Lang Syne (traditional, public domain)
  "auld-lang-syne":{bpm:92,n:"C4 1,F4 1.5,F4 .5,F4 1,A4 1,G4 1.5,F4 .5,G4 1,A4 1,F4 1.5,F4 .5,A4 1,C5 1,D5 3,D5 1,C5 1.5,A4 .5,A4 1,F4 1,G4 1.5,F4 .5,G4 1,A4 1,F4 1.5,D4 .5,D4 1,C4 1,F4 3,D5 1,C5 1.5,A4 .5,A4 1,F4 1,G4 1.5,F4 .5,G4 1,D5 1,C5 1.5,A4 .5,A4 1,C5 1,D5 3,F5 1,C5 1.5,A4 .5,A4 1,F4 1,G4 1.5,F4 .5,G4 1,A4 1,F4 1.5,D4 .5,D4 1,C4 1,F4 3,R 2"}
};
function startBox(){const c=ac();if(!c)return false;const tune=TUNES[(C.music||{}).track]||TUNES["auld-lang-syne"];
  const notes=tune.n.split(",").map(s=>{const[a,b]=s.trim().split(" ");return[a,parseFloat(b)]}),beat=60/tune.bpm;
  master=c.createGain();master.gain.value=.9;master.connect(c.destination);let i=0,t=c.currentTime+.15;
  const tick=()=>{while(t<c.currentTime+.6){const[nm,b]=notes[i];if(nm!=="R"){const f=440*Math.pow(2,(N[nm]+12-69)/12);bell(c,f,t,.085,Math.max(1.1,b*beat*1.6),master);if(b>=1)bell(c,f/2,t,.03,1.4,master)}
    t+=b*beat;i=(i+1)%notes.length}};
  tick();musicTimer=setInterval(tick,200);return true}
function setMusic(v){const b=$("#music"),m=C.music||{};
  // If CONFIG.music.source is "mp3" and mp3Url is set, your own New Year track plays instead of the music box.
  if(v){let ok=false;if(m.source==="mp3"&&m.mp3Url){if(!mp3){mp3=new Audio(m.mp3Url);mp3.loop=true;mp3.volume=.5}mp3.play().catch(()=>setMusic(false));ok=true}else ok=startBox();if(!ok)return}
  else{if(mp3)mp3.pause();clearInterval(musicTimer);if(master){try{master.gain.setTargetAtTime(0,AC.currentTime,.15)}catch(e){}master=null}}
  musicOn=v;b.setAttribute("aria-pressed",String(v));b.setAttribute("aria-label",v?"Pause background music":"Play background music")}

/* ───────── hanging gold stars (replaces the string lights) ───────── */
function drawLights(){$$(".lights").forEach(h=>{const w=Math.max(320,h.clientWidth||innerWidth),seg=w<600?w/3:w/Math.round(w/210),n=Math.round(w/seg),H=w<700?84:96,dip=H*.28;
  const star=(x,y,r,c)=>`<path class="${c}" d="M${x} ${y-r}L${x+r*.28} ${y-r*.28}L${x+r} ${y}L${x+r*.28} ${y+r*.28}L${x} ${y+r}L${x-r*.28} ${y+r*.28}L${x-r} ${y}L${x-r*.28} ${y-r*.28}Z"/>`;
  let p="M0 4",b="",k=0;for(let i=0;i<n;i++){const x0=i*seg;p+=` Q${x0+seg/2} ${4+dip*2} ${x0+seg} 4`;
    for(let j=1;j<=3;j++){const t=j/4,x=x0+seg*t,y=4+2*t*(1-t)*dip*2,len=16+((k*13)%5)*7,r=k%3===1?9:6;k++;
      b+=`<g class="bulb"><path class="str" d="M${x} ${y}V${y+len}"/><circle class="glow c${k%4+1}" cx="${x}" cy="${y+len+r}" r="${r*2}"/>${star(x,y+len+r,r,"c"+(k%4+1))}</g>`}}
  h.innerHTML=`<svg viewBox="0 0 ${w} ${H}" preserveAspectRatio="none"><path class="wire" d="${p}"/>${b}</svg>`})}

/* ───────── slowly falling gold confetti & glitter (canvas, capped) ───────── */
const snow=(()=>{const cv=$("#snow"),cx=cv.getContext("2d");let W=0,H=0,fl=[],raf=0,last=0,dpr=1;
  const COLS=["#D4AF37","#F5E6B8","#E9CF7A","#B08A26","#FFF6D6"];
  function size(){dpr=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.min(60,Math.round(W*H/18000));while(fl.length<n)fl.push(mk(true));fl.length=n}
  function mk(any){const g=Math.random()<.4;return{x:Math.random()*W,y:any?Math.random()*H:-10,g:g,w:g?1+Math.random()*1.4:3+Math.random()*3,h:g?0:6+Math.random()*5,
    v:g?10+Math.random()*12:16+Math.random()*20,p:Math.random()*6.28,s:.4+Math.random()*.8,r:Math.random()*6.28,vr:(Math.random()-.5)*2.4,f:Math.random()*6.28,c:COLS[Math.floor(Math.random()*COLS.length)],a:.45+Math.random()*.45}}
  function frame(t){raf=requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;cx.clearRect(0,0,W,H);
    for(let i=0;i<fl.length;i++){const f=fl[i];f.y+=f.v*dt;f.p+=f.s*dt;f.x+=Math.sin(f.p)*12*dt;f.r+=f.vr*dt;f.f+=dt*4;if(f.y>H+10)fl[i]=mk(false);
      cx.fillStyle=f.c;
      if(f.g){cx.globalAlpha=f.a*(.45+.55*Math.abs(Math.sin(f.f)));cx.beginPath();cx.arc(f.x,f.y,f.w,0,6.283);cx.fill()}
      else{cx.globalAlpha=f.a;cx.save();cx.translate(f.x,f.y);cx.rotate(f.r);cx.scale(1,Math.cos(f.f));cx.fillRect(-f.w/2,-f.h/2,f.w,f.h);cx.restore()}}
    cx.globalAlpha=1}
  function start(){if(reduced||raf)return;last=performance.now();raf=requestAnimationFrame(frame)}
  function stop(){cancelAnimationFrame(raf);raf=0}
  document.addEventListener("visibilitychange",()=>document.hidden?stop():start());
  return{size,start}})();

/* ───────── countdown ───────── */
function tick(){
  const body=$("#count-body");if(!body)return;const s=startDT(),now=new Date(),lab=$("#count-label");
  const sameDay=now.getFullYear()===s.getFullYear()&&now.getMonth()===s.getMonth()&&now.getDate()===s.getDate();
  const dayEnd=new Date(s.getFullYear(),s.getMonth(),s.getDate()+1);
  let state=sameDay?"today":now>=dayEnd?"after":"before";
  if(body.dataset.state!==state){body.dataset.state=state;lab.hidden=state!=="before";
    body.innerHTML=state==="before"?`<div class="count" role="timer" aria-label="Countdown to the party">${["Days","Hours","Minutes","Seconds"].map((l,i)=>`<div><b id="cd${i}">0</b><span>${i===2?"Mins":i===3?"Secs":l}</span></div>`).join("")}</div>`
      :`<p class="count-msg">${esc(state==="today"?ev().today:"Thank you for celebrating with us")}</p>${state==="today"&&C.startTime&&now<s?`<p>Doors open at ${esc(timeOf(s))}</p>`:""}`}
  if(state==="before"){let d=Math.max(0,Math.floor((s-now)/1000));const v=[Math.floor(d/86400),Math.floor(d%86400/3600),Math.floor(d%3600/60),d%60];
    v.forEach((x,i)=>{const e=$("#cd"+i);if(e)e.textContent=i?p2(x):x})}
}

/* ───────── meta tags (kept in sync with CONFIG) ───────── */
function meta(){
  const sh=C.share||{},t=sh.title||(title()+(C.hosts?" · "+C.hosts:"")),s=startDT();
  const d=sh.description||(intro()+"!"+(s?" "+longDate()+(C.startTime?" at "+timeOf(s):"")+".":"")+" Tap to open your invitation.");
  document.title=t;const set=(sel,v)=>{const m=$(sel);if(m&&v)m.setAttribute("content",v)};
  set('meta[name="description"]',d);set('meta[property="og:title"]',t);set('meta[property="og:description"]',d);set('meta[name="twitter:title"]',t);set('meta[name="twitter:description"]',d);
  set('meta[name="theme-color"]',getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
}

/* ───────── render ───────── */
let io=null;
function render(){
  const t=theme(),g=guest();document.documentElement.dataset.theme=t;
  // envelope
  $("#env-from").innerHTML=C.hosts?`An invitation from<b class="foil">${esc(C.hosts)}</b>`:"";
  $("#env-dear").textContent=g?(C.greeting||"Dear"):"A special invitation";
  const nm=$("#env-name");nm.textContent=g||"You're Invited";nm.classList.toggle("long",(g||"").length>20);
  $("#env-letter-small").textContent="You're invited";$("#env-letter-title").textContent=title();
  const emb=`<b>${A.sealStar}${newYear()}</b>`;
  $("#seal").innerHTML=`<div class="seal-half l"><div class="wax">${emb}</div></div><div class="seal-half r"><div class="wax">${emb}</div></div>`;
  // card
  const parts=[hero(),countdown(),details(),schedule(),menu(),midnight(),buttons(),rsvp(),footer()].filter(Boolean);
  $("#card").innerHTML=["tl","tr","bl","br"].map(c=>`<div class="corner ${c}">${A.corner}</div>`).join("")+parts.join(divider());
  $("#music").hidden=!(C.music&&C.music.enabled);
  meta();tick();drawLights();observe();
}
function observe(){
  const els=$$(".rv");if(reduced||PREVIEW||!("IntersectionObserver"in window)){els.forEach(e=>e.classList.add("on"));return}
  if(io)io.disconnect();io=new IntersectionObserver(en=>en.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px",threshold:.05});
  els.forEach(e=>io.observe(e));
}

/* ───────── envelope → 3·2·1 → fireworks → card ───────── */
const scr=$("#envelope-screen"),page=$("#page"),cnt=$("#nye-count");
function showCard(instant){
  page.hidden=false;document.body.classList.remove("locked");
  if(instant){scr.hidden=true;page.style.transition="none";page.classList.add("in");requestAnimationFrame(()=>page.style.transition="")}
  else{scr.classList.add("done");requestAnimationFrame(()=>requestAnimationFrame(()=>page.classList.add("in")));setTimeout(()=>scr.hidden=true,900)}
  drawLights();observe();
}
function countIn(done){
  const sp=cnt.querySelector("span"),snd=(C.sounds||{}).chime!==false,steps=["3","2","1"];let i=0;
  cnt.classList.add("on");
  const next=()=>{
    if(i<steps.length){sp.className="";sp.textContent=steps[i];void sp.offsetWidth;sp.className="go";try{if(snd)tickSound(false)}catch(e){}i++;setTimeout(next,620);return}
    sp.className="msg";sp.textContent="Happy New Year!";void sp.offsetWidth;sp.className="msg go";try{if(snd)tickSound(true)}catch(e){}
    fireworksShow();
    setTimeout(()=>{cnt.classList.remove("on");done()},1050);
  };
  next();
}
let opening=false;
function openEnvelope(){
  if(opening)return;opening=true;const s=C.sounds||{};
  try{if(s.paper!==false)paperSound();if(s.chime!==false)setTimeout(chime,1050)}catch(e){}
  if(reduced){showCard(false);return}
  const env=$("#env"),sr=$("#seal").getBoundingClientRect();
  scr.classList.add("opening");env.classList.add("open");burst(sr.left+sr.width/2,sr.top+sr.height/2,14);
  setTimeout(()=>env.classList.add("away"),1850);
  if(C.introCountdown===false){setTimeout(()=>showCard(false),2000);return}
  setTimeout(()=>countIn(()=>showCard(false)),1900);
}

/* ───────── events ───────── */
$("#env-btn").addEventListener("click",openEnvelope);
$("#music").addEventListener("click",()=>setMusic(!musicOn));
$("#card").addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.id==="ornament"){const r=t.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.65,26);t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");try{if((C.sounds||{}).chime!==false)chime()}catch(x){}}
  else if(t.id==="btn-cal"){const m=$("#cal-menu"),o=m.hidden;m.hidden=!o;t.setAttribute("aria-expanded",String(o))}
  else if(t.id==="btn-ics")downloadIcs();
  else if(t.id==="rsvp-link"){const l=(C.rsvp||{}).link;if(l)openUrl(l);rsvpDone("link","","")}
  else if(t.id==="rsvp-again"){$("#rsvp-done").hidden=true;$("#rsvp-form").hidden=false}
  else if(t.dataset.step){const o=$("#r-n"),v=Math.max(1,Math.min(+o.dataset.max,+o.textContent+ +t.dataset.step));o.textContent=v}
});
$("#card").addEventListener("change",e=>{if(e.target.name==="attend"){$("#r-extra").hidden=e.target.value==="no";$("#r-err").textContent=""}});
$("#card").addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="rsvp-form")sendRsvp()});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{snow.size();drawLights()},150)});
setInterval(tick,1000);

// live preview hook used by editor.html
if(PREVIEW)addEventListener("message",e=>{const m=e.data||{};
  if(m.type==="invite:update"&&m.config){C=m.config;if(musicOn)setMusic(false);mp3=null;render()}
  if(m.type==="invite:scroll"){const el=document.getElementById(m.id);if(el&&!page.hidden)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-12,behavior:reduced?"auto":"smooth"})}});

/* ───────── go ───────── */
if(PREVIEW)document.documentElement.classList.add("in-editor");
render();snow.size();snow.start();
if(params.get("preview")==="card"||(PREVIEW&&PREVIEW.mode==="card"))showCard(true);
window.__invite={render,openEnvelope,icsText,config:()=>C};
})();
</script>
